<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Passfail - Coding Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <style>
        :root {
            --pg-navy: #1e2a3c;
            --pg-blue: #0078ff;
            --pg-bg: #f5f6f7;
            --pg-border: #d7e2eb;
            --pg-text: #263747;
            --pg-gray: #98a8b9;
            --white: #ffffff;
            --nav-text: #ffffff;
        }

        [data-theme='dark'] {
            --pg-bg: #0f172a;
            --pg-navy: #020617;
            --pg-border: #334155;
            --pg-text: #f1f5f9;
            --pg-gray: #94a3b8;
            --white: #1e293b;
            --nav-text: #f1f5f9;
        }

        body, html { margin: 0; height: 100vh; width: 100vw; overflow: hidden; background-color: var(--pg-bg); color: var(--pg-text); font-family: "Pretendard", -apple-system, sans-serif; display: flex; flex-direction: column; }
        
        .top-nav { height: 50px; background-color: var(--pg-navy); color: var(--nav-text); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; flex-shrink: 0; }
        .top-nav h1 { font-size: 15px; margin: 0; font-weight: 500; }
        .top-nav .problem-title { color: #8c9eb3; margin-left: 10px; font-weight: 400; }

        .main-container { display: flex; flex: 1; min-height: 0; border-bottom: 1px solid var(--pg-border); }
        
        .left-panel { width: 40%; height: 100%; overflow-y: auto; border-right: 1px solid var(--pg-border); background-color: var(--pg-bg); }
        .section-card { background: var(--white); border-bottom: 1px solid var(--pg-border); padding: 24px; }
        .section-header { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--pg-text); position: relative; }
        .section-header::after { content: ''; display: block; width: 20px; height: 3px; background: var(--pg-blue); margin-top: 8px; }
        .section-content { line-height: 1.8; font-size: 14.5px; }
        
        .right-panel { width: 60%; height: 100%; display: flex; flex-direction: column; background: var(--white); min-width: 0; }
        #editor-container { flex: 1; min-height: 200px; border-bottom: 1px solid var(--pg-border); }
        
        .bottom-panel { height: 300px; background: var(--white); flex-shrink: 0; display: none; flex-direction: column; border-top: 2px solid var(--pg-border); }
        .tab-menu { display: flex; background: var(--white); border-bottom: 1px solid var(--pg-border); flex-shrink: 0; }
        .tab-item { padding: 12px 24px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--pg-gray); }
        .tab-item.active { color: var(--pg-blue); border-bottom: 2px solid var(--pg-blue); }

        .result-panel { flex: 1; padding: 20px; overflow-y: auto; font-family: monospace; font-size: 13px; background: var(--pg-bg); color: var(--pg-text); }
        .test-case-row { margin-bottom: 10px; padding: 12px; border-radius: 4px; border: 1px solid var(--pg-border); background: var(--white); }
        
        .bottom-bar { height: 50px; background-color: var(--pg-navy); display: flex; align-items: center; padding: 0 20px; justify-content: flex-end; gap: 10px; flex-shrink: 0; }
        
        .btn-pg { padding: 8px 20px; border-radius: 4px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; min-width: 100px; text-align: center; }
        .btn-outline { background: transparent; color: white !important; border: 1px solid #4e5968; }
        .btn-blue { background: var(--pg-blue); color: white !important; }
        .btn-ai { background: #6a1b9a; color: white !important; display: none; }
        .btn-pg:hover { opacity: 0.8; filter: brightness(1.1); }

        .status-CORRECT { color: #2ecc71; font-weight: bold; }
        .status-WRONG { color: #e74c3c; font-weight: bold; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: var(--white); color: var(--pg-text); margin: 5% auto; padding: 30px; border-radius: 8px; width: 60%; max-height: 80%; overflow-y: auto; }
    </style>
</head>
<body>
<div id="problem-data" style="display:none;" 
     th:attr="data-desc=${problem.description}, 
              data-id=${problem.problemId}, 
              data-code=${defaultCode}, 
              data-time=${problem.timeLimitMs}, 
              data-mem=${problem.memoryLimitMb},
              data-tc-count=${#lists.size(problem.testCases)},
              data-is-solved=${isSolved},
              data-prev-code=${previousCode},
              data-is-logged-in=${#authorization.expression('isAuthenticated()')}">
</div>

<div class="top-nav">
    <h1><a href="/main" style="color: inherit; text-decoration: none;">Passfail</a> <span class="problem-title" th:text="${problem.title}">Title</span></h1>
    <div style="display:flex; align-items:center; gap:15px;">
        <button onclick="toggleTheme()" id="themeBtn" style="background:none; border:none; color:white; cursor:pointer; font-size:18px; outline:none;">🌙</button>
    </div>
</div>

<div class="main-container">
    <div class="left-panel" id="problem-sections"></div>
    <div class="right-panel">
        <div id="editor-container"></div>
        <div class="bottom-panel" id="bottom-panel">
            <div class="tab-menu">
                <div class="tab-item active" onclick="showTab('result')">실행 결과</div>
                <div class="tab-item" onclick="showTab('custom')">테스트 케이스 추가</div>
                <div style="margin-left:auto; padding-right:15px; display:flex; align-items:center;">
                    <span style="font-size:11px; color:var(--pg-gray); cursor:pointer;" onclick="hideBottomPanel()">접기 ▾</span>
                </div>
            </div>
            <div id="result-display" class="result-panel"></div>
            <div id="custom-testcases-area" class="result-panel" style="display:none;">
                <div id="tc-list"></div>
                <button class="btn-pg btn-outline" style="color:var(--pg-text) !important; border-color:var(--pg-border);" onclick="addTestCaseRow()">+ 추가하기</button>
            </div>
        </div>
    </div>
</div>

<div class="bottom-bar">
    <a href="/problem/problemList" class="btn-pg btn-outline" style="text-decoration:none; margin-right:auto; display:flex; align-items:center; justify-content:center;">나가기</a>
    <button class="btn-pg btn-outline" onclick="downloadPdf()" style="background: #27ae60; border-color: #27ae60;">PDF 다운로드</button>
    <button id="aiReviewBtn" class="btn-pg btn-ai" onclick="openAiReview()">AI 코드 리뷰</button>
    <button id="runBtn" class="btn-pg btn-outline" onclick="runCode()">코드 실행</button>
    <button id="submitBtn" class="btn-pg btn-blue" onclick="submitCode()">제출 후 채점</button>
</div>

<!-- AI Modal -->
<div id="aiModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; border-bottom:1px solid var(--pg-border); padding-bottom:10px;">
            <h3 style="margin:0;">AI 코드 분석 리포트</h3>
            <span style="cursor:pointer; font-size:24px;" onclick="closeAiReview()">&times;</span>
        </div>
        <div id="ai-content"></div>
    </div>
</div>

<!-- Solved Modal -->
<div id="solvedModal" class="modal">
    <div class="modal-content" style="width: 400px; text-align: center; margin-top: 15%;">
        <h3 style="margin-bottom: 20px;">정답을 맞춘 문제입니다.</h3>
        <p style="color: var(--pg-gray); font-size: 14px; margin-bottom: 30px;">기존에 작성한 정답을 확인하시겠습니까, 아니면 다시 풀어보시겠습니까?</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn-pg btn-outline" style="color:var(--pg-text) !important; border-color:var(--pg-border);" onclick="closeSolvedModal()">다시 풀기</button>
            <button class="btn-pg btn-blue" onclick="loadPreviousSolution()">정답 보기</button>
        </div>
    </div>
</div>

<script>
    const dataEl = document.getElementById('problem-data');
    const rawDescription = dataEl.getAttribute('data-desc');
    const problemId = dataEl.getAttribute('data-id');
    const defaultCode = dataEl.getAttribute('data-code');
    const timeLimit = dataEl.getAttribute('data-time');
    const memLimit = dataEl.getAttribute('data-mem');
    const officialTCCount = parseInt(dataEl.getAttribute('data-tc-count'));
    const isSolved = dataEl.getAttribute('data-is-solved') === 'true';
    const previousCode = dataEl.getAttribute('data-prev-code');

    let editor = null;
    let currentTheme = 'light';
    let lastResults = null;

    function renderSections() {
        const container = document.getElementById('problem-sections');
        const parts = rawDescription.split('### ').filter(p => p.trim() !== "");
        parts.forEach(part => {
            const lines = part.split('\n');
            const title = lines[0].trim();
            const content = lines.slice(1).join('\n').trim();
            const card = document.createElement('div');
            card.className = 'section-card';
            card.innerHTML = `<div class="section-header">${title}</div><div class="section-content">${content.replace(/\n/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>')}</div>`;
            container.appendChild(card);
        });
        const constCard = document.createElement('div');
        constCard.className = 'section-card';
        constCard.innerHTML = `<div class="section-header">제한 사항</div><div class="section-content"><ul><li>시간 제한: ${timeLimit}ms</li><li>메모리 제한: ${memLimit}MB</li></ul></div>`;
        container.appendChild(constCard);
    }

    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
            value: defaultCode,
            language: 'java',
            theme: 'vs',
            automaticLayout: true,
            fontSize: 14,
            minimap: { enabled: false },
            padding: { top: 10 }
        });

        // 이미 해결한 문제라면 모달 띄우기
        if (isSolved) {
            document.getElementById('solvedModal').style.display = 'block';
        }
    });

    renderSections();

    function closeSolvedModal() {
        document.getElementById('solvedModal').style.display = 'none';
    }

    function loadPreviousSolution() {
        if (editor && previousCode) {
            editor.setValue(previousCode);
        }
        closeSolvedModal();
    }

    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        if (currentTheme === 'light') {
            body.setAttribute('data-theme', 'dark');
            currentTheme = 'dark';
            btn.innerText = '☀️';
            monaco.editor.setTheme('vs-dark');
        } else {
            body.removeAttribute('data-theme');
            currentTheme = 'light';
            btn.innerText = '🌙';
            monaco.editor.setTheme('vs');
        }
    }

    function showTab(type) {
        document.getElementById('bottom-panel').style.display = 'flex';
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.getElementById('result-display').style.display = 'none';
        document.getElementById('custom-testcases-area').style.display = 'none';
        if (type === 'result') {
            document.querySelector('.tab-item:nth-child(1)').classList.add('active');
            document.getElementById('result-display').style.display = 'block';
        } else {
            document.querySelector('.tab-item:nth-child(2)').classList.add('active');
            document.getElementById('custom-testcases-area').style.display = 'block';
        }
        if(editor) editor.layout();
    }

    function hideBottomPanel() { 
        document.getElementById('bottom-panel').style.display = 'none'; 
        if(editor) editor.layout();
    }

    let tcIdx = 0;
    function addTestCaseRow() {
        tcIdx++;
        const row = document.createElement('div');
        row.className = 'custom-case-row';
        row.id = `tc-${tcIdx}`;
        row.style = "display:flex; gap:10px; margin-bottom:10px;";
        row.innerHTML = `<textarea class="tc-in" placeholder="입력" style="flex:1; height:40px; padding:5px; background:var(--pg-bg); color:var(--pg-text); border:1px solid var(--pg-border); resize:none;"></textarea>
                         <textarea class="tc-ex" placeholder="기대값" style="flex:1; height:40px; padding:5px; background:var(--pg-bg); color:var(--pg-text); border:1px solid var(--pg-border); resize:none;"></textarea>
                         <button onclick="document.getElementById('tc-${tcIdx}').remove()" style="color:red; background:none; border:none; cursor:pointer; font-size:20px;">&times;</button>`;
        document.getElementById('tc-list').appendChild(row);
    }

    async function runCode() {
        if (dataEl.getAttribute('data-is-logged-in') !== 'true') {
            if (confirm('코드 실행은 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) {
                window.location.href = '/login';
            }
            return;
        }
        showTab('result');
        const display = document.getElementById('result-display');
        display.innerHTML = '<div style="color:var(--pg-gray);">코드 실행 중...</div>';
        const customTC = [];
        document.querySelectorAll('.custom-case-row').forEach(row => {
            customTC.push({ input: row.querySelector('.tc-in').value, expected: row.querySelector('.tc-ex').value });
        });
        try {
            const res = await fetch(`/codingtest/${problemId}/run`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: editor.getValue(), customTestCases: customTC })
            });
            displayResults(await res.json());
        } catch (e) { display.innerHTML = '<div style="color:red;">실행 중 에러가 발생했습니다.</div>'; }
    }

    async function submitCode() {
        if (dataEl.getAttribute('data-is-logged-in') !== 'true') {
            if (confirm('채점 및 제출은 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) {
                window.location.href = '/login';
            }
            return;
        }
        showTab('result');
        const display = document.getElementById('result-display');
        display.innerHTML = '<div style="color:var(--pg-blue);">채점 중...</div>';
        try {
            const res = await fetch(`/codingtest/${problemId}/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: editor.getValue() })
            });
            const data = await res.json();
            
            if (data.error) {
                display.innerHTML = `<div style="color:red; padding:10px;">서버 오류: ${data.error}</div>`;
                return;
            }

            displayResults(data.results);
            if (data.allCorrect) {
                document.getElementById('aiReviewBtn').style.display = 'block';
                lastResults = data.results;
                alert('정답입니다!');
            }
        } catch (e) { 
            console.error(e);
            display.innerHTML = '<div style="color:red; padding:10px;">제출 중 에러가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>'; 
        }
    }

    function displayResults(results) {
        const display = document.getElementById('result-display');
        
        // 결과가 유효하지 않은 경우 이전 결과 유지 또는 에러 메시지
        if(!results || results.length === 0) {
            if (display.innerHTML.includes('test-case-row')) {
                // 이미 결과가 있으면 유지
                return;
            }
            display.innerHTML = '<div style="color:red; padding:10px;">결과를 불러올 수 없습니다. 다시 시도해 주세요.</div>';
            return;
        }

        display.innerHTML = '';
        results.forEach((r, i) => {
            const div = document.createElement('div');
            div.className = 'test-case-row';
            let title = i < officialTCCount ? `기본 테스트 ${i+1}` : `커스텀 테스트 ${i - officialTCCount + 1}`;
            div.innerHTML = `<div style="font-weight:600; margin-bottom:5px;">${title}: <span class="status-${r.status}">${r.status}</span></div>
                             <div style="color:var(--pg-gray); font-size:11px;">시간: ${r.executionTime || 0}ms</div>
                             ${r.output ? `<div style="margin-top:5px; color:var(--pg-text);">출력: ${r.output}</div>` : ''}
                             ${r.error ? `<pre style="color:red; font-size:12px; margin-top:5px; white-space:pre-wrap;">${r.error}</pre>` : ''}`;
            display.appendChild(div);
        });
        display.scrollTop = 0;
    }

    async function openAiReview() {
        if (dataEl.getAttribute('data-is-logged-in') !== 'true') {
            if (confirm('AI 리뷰는 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) {
                window.location.href = '/login';
            }
            return;
        }

        if (!confirm('AI 코드 리뷰를 요청하시겠습니까? (300 바나나 소모)')) {
            return;
        }

        document.getElementById('aiModal').style.display = 'block';
        const content = document.getElementById('ai-content');
        content.innerHTML = '<div style="text-align:center; padding:20px;">AI 분석 리포트를 생성 중입니다...</div>';
        try {
            const res = await fetch(`/codingtest/${problemId}/ai-review`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: editor.getValue(), results: lastResults })
            });
            const data = await res.json();
            content.innerHTML = data.review.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        } catch (e) { 
            console.error(e);
            content.innerHTML = 'AI 리뷰 생성에 실패했습니다.'; 
        }
    }

    function closeAiReview() { document.getElementById('aiModal').style.display = 'none'; }

    function downloadPdf() {
        if (dataEl.getAttribute('data-is-logged-in') !== 'true') {
            if (confirm('PDF 다운로드는 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) {
                window.location.href = '/login';
            }
            return;
        }

        if (confirm('문제를 PDF로 다운로드하시겠습니까? (1,000 바나나 소모)')) {
            window.location.href = `/problem/${problemId}/download`;
        }
    }

    async function showHint() {
        if (dataEl.getAttribute('data-is-logged-in') !== 'true') {
            if (confirm('힌트 보기는 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) {
                window.location.href = '/login';
            }
            return;
        }

        if (confirm('힌트를 보시겠습니까? (500 바나나 소모)\n이미 구매한 힌트는 추가 비용 없이 볼 수 있습니다.')) {
            try {
                const res = await fetch(`/api/hint/${problemId}`, {
                    method: 'POST'
                });
                
                if (res.ok) {
                    const hintText = await res.text();
                    alert('💡 힌트: ' + hintText);
                } else {
                    const errorMsg = await res.text();
                    alert('❌ 실패: ' + (errorMsg || '잔액이 부족하거나 오류가 발생했습니다.'));
                }
            } catch (e) {
                console.error(e);
                alert('힌트를 불러오는 중 오류가 발생했습니다.');
            }
        }
    }
</script>

</body>
</html>
