<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- [Standard Coding Test Editor] -->
<head th:replace="~{codingtest/editorCore :: head('Passfail - Coding Test', ~{::.extra-head})}">
    <th:block class="extra-head">
        <!-- 기본 모드는 추가 헤드 필요 없음 -->
    </th:block>
</head>
<body>
    <div id="problem-data" style="display:none;" 
         th:attr="data-desc=${problem.description}, data-id=${problem.problemId}, data-code=${defaultCode}, 
                  data-time=${problem.timeLimitMs}, data-mem=${problem.memoryLimitMb}, data-tc-count=${#lists.size(problem.testCases)},
                  data-is-solved=${isSolved}, data-prev-code=${previousCode}, 
                  data-is-logged-in=${#authorization.expression('isAuthenticated()')}">
    </div>

    <div th:replace="~{codingtest/editorCore :: topNav}"></div>

    <div class="main-container">
        <div th:replace="~{codingtest/editorCore :: problemPanel}"></div>
        <div class="right-panel">
            <div id="editor-container"></div>
            <div th:replace="~{codingtest/editorCore :: bottomPanel}"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="/problem/problemList" class="btn-pg btn-outline" style="text-decoration:none; margin-right:auto; display:flex; align-items:center; justify-content:center;">나가기</a>
        <button class="btn-pg btn-outline" style="background: #27ae60 !important; border-color: #27ae60;" onclick="EditorCore.downloadPdf()">PDF 다운로드</button>        
        <button id="aiReviewBtn" class="btn-pg btn-ai" onclick="EditorCore.openAiReview()">AI 코드 리뷰</button>
        <button class="btn-pg btn-outline" onclick="EditorCore.runCode()">코드 실행</button>
        <button class="btn-pg btn-blue" onclick="EditorCore.submitCode()">제출 후 채점</button>
    </div>

    <div id="aiModal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px; border-bottom:1px solid var(--pg-border); padding-bottom:10px;">
                <h3 style="margin:0;">AI 코드 분석 리포트</h3>
                <span style="cursor:pointer; font-size:24px;" onclick="closeAiReview()">&times;</span>
            </div>
            <div id="ai-content"></div>
        </div>
    </div>

    <div id="solvedModal" class="modal">
        <div class="modal-content" style="width: 400px; text-align: center; margin-top: 15%;">
            <h3 style="margin-bottom: 20px;">정답을 맞춘 문제입니다.</h3>
            <p style="color: var(--pg-gray); font-size: 14px; margin-bottom: 30px;">기존에 작성한 정답을 확인하시겠습니까, 아니면 다시 풀어보시겠습니까?</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-pg btn-outline" style="color:var(--pg-text) !important; border-color:var(--pg-border);" onclick="closeSolvedModal()">다시 풀기</button>
                <button class="btn-pg btn-blue" onclick="loadPreviousSolution()">정답 보기</button>
            </div>
        </div>
    </div>

    <div th:replace="~{codingtest/editorCore :: scripts}"></div>

    function displayResults(results) {
        const display = document.getElementById('result-display');
        
        // 결과가 유효하지 않은 경우 이전 결과 유지 또는 에러 메시지
        if(!results || results.length === 0) {
            if (display.innerHTML.includes('test-case-row')) {
                // 이미 결과가 있으면 유지
                return;
            }
            display.innerHTML = '<div style="color:red; padding:10px;">결과를 불러올 수 없습니다. 다시 시도해 주세요.</div>';
            return;
        }

        display.innerHTML = '';
        results.forEach((r, i) => {
            const div = document.createElement('div');
            div.className = 'test-case-row';
            let title = i < officialTCCount ? `기본 테스트 ${i+1}` : `커스텀 테스트 ${i - officialTCCount + 1}`;
            div.innerHTML = `<div style="font-weight:600; margin-bottom:5px;">${title}: <span class="status-${r.status}">${r.status}</span></div>
                             <div style="color:var(--pg-gray); font-size:11px;">시간: ${r.executionTime || 0}ms</div>
                             ${r.output ? `<div style="margin-top:5px; color:var(--pg-text);">출력: ${r.output}</div>` : ''}
                             ${r.error ? `<pre style="color:red; font-size:12px; margin-top:5px; white-space:pre-wrap;">${r.error}</pre>` : ''}`;
            display.appendChild(div);
        });
        display.scrollTop = 0;
    }

    async function openAiReview() {
        if (dataEl.getAttribute('data-is-logged-in') !== 'true') {
            if (confirm('AI 리뷰는 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) {
                window.location.href = '/login';
            }
            return;
        }

        if (!confirm('AI 코드 리뷰를 요청하시겠습니까? (2000 바나나 소모)')) {
            return;
        }

        document.getElementById('aiModal').style.display = 'block';
        const content = document.getElementById('ai-content');
        content.innerHTML = '<div style="text-align:center; padding:20px;">AI 분석 리포트를 생성 중입니다...</div>';
        try {
            const res = await fetch(`/codingtest/${problemId}/ai-review`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: editor.getValue(), results: lastResults })
            });
            const data = await res.json();
            content.innerHTML = data.review.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        } catch (e) { 
            console.error(e);
            content.innerHTML = 'AI 리뷰 생성에 실패했습니다.'; 
        }
    }

    function closeAiReview() { document.getElementById('aiModal').style.display = 'none'; }

    function downloadPdf() {
        if (dataEl.getAttribute('data-is-logged-in') !== 'true') {
            if (confirm('PDF 다운로드는 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) {
                window.location.href = '/login';
            }
            return;
        }

        if (confirm('문제를 PDF로 다운로드하시겠습니까? (1,000 바나나 소모)')) {
            window.location.href = `/problem/${problemId}/download`;
        }
    }
