<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- [Passfail Editor Core] 공통 부품 및 라이브러리 -->

<head th:fragment="head(title, extraHead)">
    <meta charset="UTF-8">
    <title th:text="${title}">Passfail Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    
    <th:block th:replace="${extraHead}"></th:block>
    
    <script th:src="@{/js/util/problem-utils.js}" src="/js/util/problem-utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <style>
        :root { --pg-navy: #0f172a; --pg-green: #22c55e; --pg-bg: #f8fafc; --pg-border: #e2e8f0; --pg-text: #1e293b; --pg-gray: #64748b; --white: #ffffff; --nav-text: #ffffff; }
        [data-theme='dark'] { --pg-bg: #020617; --pg-navy: #000000; --pg-border: #1e293b; --pg-text: #f1f5f9; --pg-gray: #94a3b8; --white: #0f172a; --nav-text: #f1f5f9; }
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background-color: var(--pg-bg); color: var(--pg-text); display: flex; flex-direction: column; }
        .top-nav { height: 50px; background-color: var(--pg-navy); color: var(--nav-text); display: flex; align-items: center; padding: 0 24px; justify-content: space-between; flex-shrink: 0; z-index: 10; }
        .top-nav h1 { font-size: 20px; margin: 0; font-weight: 900; }
        .main-container { display: flex; flex: 1; width: 100%; min-height: 0; overflow: hidden; border-bottom: 1px solid var(--pg-border); }
        .left-panel { width: 45%; min-width: 300px; height: 100%; overflow-y: auto; border-right: 1px solid var(--pg-border); background-color: var(--pg-bg); }
        .section-card { background: var(--white); border-bottom: 1px solid var(--pg-border); padding: 24px; }
        .section-header { font-size: 15px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .right-panel { flex: 1; height: 100%; display: flex; flex-direction: column; background: var(--white); min-width: 0; }
        #editor-container { flex: 1; width: 100%; min-height: 0; }
        .bottom-panel { height: 280px; background: var(--white); flex-shrink: 0; display: none; flex-direction: column; border-top: 1px solid var(--pg-border); z-index: 5; }
        .bottom-bar { height: 50px; background-color: var(--pg-navy); display: flex; align-items: center; padding: 0 20px; justify-content: flex-end; gap: 10px; flex-shrink: 0; z-index: 10; }
        .btn-pg { padding: 8px 20px; border-radius: 6px; border: none; font-size: 12.5px; font-weight: 800; cursor: pointer; min-width: 90px; text-align: center; }
        .btn-outline { background: rgba(255,255,255,0.05); color: white !important; border: 1px solid rgba(255,255,255,0.2); }
        .btn-blue { background: var(--pg-green); color: white !important; }
        .btn-ai { background: #8b5cf6 !important; color: white !important; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        .modal-content { background: var(--white); color: var(--pg-text); margin: 5% auto; padding: 40px; border-radius: 20px; width: 70%; max-height: 80%; overflow-y: auto; }
        .tab-menu { display: flex; background: var(--white); border-bottom: 1px solid var(--pg-border); flex-shrink: 0; }
        .tab-item { padding: 12px 24px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--pg-gray); }
        .tab-item.active { color: #0078ff; border-bottom: 2px solid #0078ff; }
        .result-panel { flex: 1; padding: 20px; overflow-y: auto; font-family: monospace; font-size: 13px; background: var(--pg-bg); color: var(--pg-text); }
        .test-case-row { margin-bottom: 10px; padding: 12px; border-radius: 4px; border: 1px solid var(--pg-border); background: var(--white); }

        /* Status Colors */
        .status-CORRECT, .status-ACCEPTED { color: #22c55e; font-weight: 700; }
        .status-WRONG, .status-WRONG_ANSWER { color: #ef4444; font-weight: 700; }
        .status-TIMEOUT, .status-TIME_LIMIT { color: #f59e0b; font-weight: 700; }
        .status-COMPILE_ERROR, .status-RUNTIME_ERROR, .status-MEMORY_LIMIT, .status-MEMORY_LIMIT_EXCEEDED, .status-SYSTEM_ERROR { color: #ef4444; font-weight: 700; }
        </style>
        </head>

<body>
    <div th:fragment="topNav" class="top-nav">
        <h1><a href="/main" style="color: #ffffff; text-decoration: none;">Passfail</a> <span class="problem-title" th:text="${problem.title}">Title</span></h1>
        <div style="display:flex; align-items:center; gap:15px;">
            <select id="languageSelect" onchange="EditorCore.changeLanguage(this.value)" style="background:var(--pg-navy); color:white; border:1px solid #4e5968; border-radius:4px; padding:2px 8px; font-size:12px; outline:none; cursor:pointer;">
                <option value="java" selected>Java</option>
                <option value="python">Python</option>
                <option th:if="${isLinux}" value="cpp">C++</option>
            </select>
            <button onclick="EditorCore.toggleTheme()" id="themeBtn" style="background:none; border:none; color:white; cursor:pointer; font-size:18px; outline:none;">🌙</button>
        </div>
    </div>

    <div th:fragment="problemPanel" class="left-panel" id="problem-sections"></div>

    <div th:fragment="bottomPanel" class="bottom-panel" id="bottom-panel">
        <div class="tab-menu">
            <div class="tab-item active" onclick="EditorCore.showTab('result')">실행 결과</div>
            <div class="tab-item" onclick="EditorCore.showTab('custom')">테스트 케이스 추가</div>
            <div style="margin-left:auto; padding-right:15px; display:flex; align-items:center;">
                <span style="font-size:11px; color:var(--pg-gray); cursor:pointer;" onclick="EditorCore.hideBottomPanel()">접기 ▾</span>
            </div>
        </div>
        <div id="result-display" class="result-panel"></div>
        <div id="custom-testcases-area" class="result-panel" style="display:none;">
            <div id="tc-list"></div>
            <button class="btn-pg btn-outline" style="color:var(--pg-text) !important; border-color:var(--pg-border);" onclick="EditorCore.addTestCaseRow()">+ 추가하기</button>
        </div>
    </div>

    <script th:fragment="scripts">
        (function() {
            // 변수 주입용 DOM 요소 확인 (타임리프 인라인 사용하지 않음)
            const dataEl = document.getElementById('problem-data');
            const isLinux = dataEl ? (dataEl.getAttribute('data-is-linux') === 'true') : false;
            const battleMode = dataEl ? dataEl.getAttribute('data-mode') : 'null';

            const EditorCore = {
                editor: null, currentTheme: 'light', lastResults: null,
                battleMode: battleMode, config: null,
                
                init(config) {
                    this.config = config;
                    const dataEl = document.getElementById('problem-data');
                    if(!dataEl) return;
                    this.renderSections(dataEl.getAttribute('data-desc'), dataEl.getAttribute('data-time'), dataEl.getAttribute('data-mem'));
                    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
                    require(['vs/editor/editor.main'], () => {
                        this.editor = monaco.editor.create(document.getElementById('editor-container'), {
                            value: dataEl.getAttribute('data-code'), language: 'java', theme: 'vs', automaticLayout: true, fontSize: 14, minimap: { enabled: false }
                        });
                        if (dataEl.getAttribute('data-is-solved') === 'true') {
                            const sm = document.getElementById('solvedModal');
                            if(sm) sm.style.display = 'block';
                            
                            // 이미 풀었던 문제라면 AI 리뷰 버튼 활성화
                            const aiBtn = document.getElementById('aiReviewBtn');
                            if(aiBtn) aiBtn.style.display = 'block';
                        }
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                        if (config && config.onEditorLoaded) config.onEditorLoaded(this.editor);
                    });
                },

                openAiReview() {
                    if (!confirm('AI 코드리뷰를 요청하시겠습니까? (2,000 바나나 소모)')) {
                        return;
                    }

                    const aiModal = document.getElementById('aiModal');
                    const aiContent = document.getElementById('ai-content');
                    if (!aiModal || !aiContent) return;

                    aiModal.style.display = 'block';
                    aiContent.innerHTML = '<div style="text-align:center; padding:40px;"><div class="loading-spinner" style="border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 0 auto 20px;"></div><p>AI가 코드를 분석하고 있습니다...</p></div>';

                    const problemId = document.getElementById('problem-data').getAttribute('data-id');
                    fetch(`/codingtest/${problemId}/ai-review`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            code: this.editor.getValue(),
                            results: this.lastResults
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        aiContent.innerHTML = `<div class="prose max-w-none" style="white-space: pre-wrap;">${data.review}</div>`;
                    })
                    .catch(err => {
                        aiContent.innerHTML = `<div style="color:red; text-align:center; padding:20px;">분석 중 오류가 발생했습니다: ${err.message}</div>`;
                    });
                },

                async downloadPdf() {
                    const dataEl = document.getElementById('problem-data');
                    const problemId = dataEl.getAttribute('data-id');
                    const isLoggedIn = dataEl.getAttribute('data-is-logged-in') === 'true';
                    
                    await ProblemUtils.downloadPdf(problemId, isLoggedIn);
                },
                
                changeLanguage(lang) {
                    if (!this.editor) return;
                    const model = this.editor.getModel();
                    monaco.editor.setModelLanguage(model, lang === 'cpp' ? 'cpp' : (lang === 'python' ? 'python' : 'java'));
                    const templates = {
                        java: 'import java.util.*;\n\npublic class Solution {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        // 코드를 작성하세요\n    }\n}',
                        python: '',
                        cpp: '#include <iostream>\n\nusing namespace std;\n\nint main() {\n    // 코드를 작성하세요\n    \n    return 0;\n}'
                    };

                    const mazeTemplates = {
                        java: 'import java.util.*;\n\npublic class Solution {\n    public static void main(String[] args) {\n        Robot robot = new Robot();\n        // 기본 탈출 로직 예시 (우측 통행)\n        while (!robot.getCurrentTileType().equals("EXIT")) {\n            if (!robot.isWallAhead()) {\n                robot.moveForward();\n            } else {\n                robot.turnRight();\n            }\n        }\n    }\n}',
                        python: 'def solve():\n    robot = Robot()\n    # 기본 탈출 로직 예시 (우측 통행)\n    while robot.get_tile() != "EXIT":\n        if not robot.is_wall():\n            robot.move_forward()\n        else:\n            robot.turn_right()\n\nif __name__ == "__main__":\n    solve()',
                        cpp: '#include <iostream>\n#include <string>\n\nusing namespace std;\n\nint main() {\n    Robot robot;\n    // 기본 탈출 로직 예시 (우측 통행)\n    while (robot.getCurrentTileType() != "EXIT") {\n        if (!robot.isWallAhead()) {\n            robot.moveForward();\n        } else {\n            robot.turnRight();\n        }\n    }\n    return 0;\n}'
                    };

                    const targetTemplates = (this.battleMode === 'LOGIC_MAZE') ? mazeTemplates : templates;

                    if (confirm('언어를 변경하면 작성 중인 코드가 초기화될 수 있습니다. 변경하시겠습니까?')) {
                        this.editor.setValue(targetTemplates[lang]);
                    }
                },
                
                renderSections(desc, time, mem) {
                    const container = document.getElementById('problem-sections');
                    if (!container || !desc) return;
                    container.innerHTML = '';
                    desc.split('### ').filter(p => p.trim() !== "").forEach(part => {
                        const lines = part.split('\n');
                        const card = document.createElement('div');
                        card.className = 'section-card';
                        card.innerHTML = `<div class="section-header">${lines[0].trim()}</div><div class="section-content">${lines.slice(1).join('\n').trim().replace(/\n/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>')}</div>`;
                        container.appendChild(card);
                    });
                    const constCard = document.createElement('div');
                    constCard.className = 'section-card';
                    constCard.innerHTML = `<div class="section-header">제한 사항</div><div class="section-content"><ul><li>시간 제한: ${time}ms</li><li>메모리 제한: ${mem}MB</li></ul></div>`;
                    container.appendChild(constCard);
                },
                
                async runCode() {
                    const dataEl = document.getElementById('problem-data');
                    if (dataEl.getAttribute('data-is-logged-in') !== 'true') { if(confirm('코드 실행은 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) window.location.href='/login'; return; }
                    this.showTab('result');
                    const display = document.getElementById('result-display');
                    display.innerHTML = '코드 실행 중...';
                    const customTC = [];
                    document.querySelectorAll('.custom-case-row').forEach(row => {
                        customTC.push({ input: row.querySelector('.tc-in').value, expected: row.querySelector('.tc-ex').value });
                    });
                    const langSelect = document.getElementById('languageSelect');
                    const language = langSelect ? langSelect.value : "java";
                    try {
                        const res = await fetch(`/codingtest/${dataEl.getAttribute('data-id')}/run?mode=${this.battleMode}`, { 
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: this.editor.getValue(), customTestCases: customTC, language: language }) 
                        });
                        const result = await res.json();
                        
                        // OnDocker: 비동기 ID가 온 경우 구독 처리
                        if (result.id && typeof EditorOnDocker !== 'undefined') {
                            EditorOnDocker.updateUI("비동기 실행 시작 (ID: " + result.id + ")");
                            EditorOnDocker.subscribe(result.id);
                        } else {
                            this.displayResults(result);
                        }
                    } catch (e) { display.innerHTML = '에러 발생'; }
                },
                
                async submitCode(onSuccess) {
                    const dataEl = document.getElementById('problem-data');
                    if (dataEl.getAttribute('data-is-logged-in') !== 'true') { if(confirm('채점 및 제출은 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) window.location.href='/login'; return; }
                    this.showTab('result');
                    const display = document.getElementById('result-display');
                    display.innerHTML = '채점 중...';
                    const langSelect = document.getElementById('languageSelect');
                    const language = langSelect ? langSelect.value : "java";
                    try {
                        const res = await fetch(`/codingtest/${dataEl.getAttribute('data-id')}/submit?mode=${this.battleMode}`, { 
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: this.editor.getValue(), language: language }) 
                        });
                        const data = await res.json();
                        if (data.error) { display.innerHTML = `서버 오류: ${data.error}`; return; }
                        
                        // OnDocker: 비동기 ID가 온 경우 구독 처리
                        if (data.id && typeof EditorOnDocker !== 'undefined') {
                            EditorOnDocker.updateUI("비동기 제출 완료. 결과를 대기합니다...");
                            EditorOnDocker.subscribe(data.id);
                        } else {
                            this.displayResults(data.results);
                            if (data.allCorrect) {
                                const aiBtn = document.getElementById('aiReviewBtn');
                                if(aiBtn) aiBtn.style.display = 'block';
                                this.lastResults = data.results;
                                if (onSuccess) onSuccess(data); 
                                else if (this.config && this.config.onSubmitComplete) this.config.onSubmitComplete(data);
                                else alert('정답입니다!');
                            }
                        }
                    } catch (e) { display.innerHTML = '제출 중 에러 발생'; }
                },
                
                displayResults(results) {
                    const display = document.getElementById('result-display');
                    if(!display) return;
                    const officialTCCount = parseInt(document.getElementById('problem-data').getAttribute('data-tc-count')) || 0;
                    display.innerHTML = '';
                    if(!Array.isArray(results)) { display.innerHTML = '<pre style="color:red;white-space:pre-wrap;">' + JSON.stringify(results) + '</pre>'; return; }
                    
                    results.forEach((r, i) => {
                        const div = document.createElement('div');
                        div.className = 'test-case-row';
                        
                        let title = i < officialTCCount ? `기본 테스트 ${i+1}` : `커스텀 테스트 ${i - officialTCCount + 1}`;
                        
                        // Status Color Mapping
                        let statusColor = '#64748b'; // Default gray
                        const s = (r.status || "").toUpperCase();
                        if (s === 'CORRECT' || s === 'ACCEPTED') statusColor = '#22c55e'; // Green
                        else if (s === 'WRONG' || s === 'WRONG_ANSWER' || s === 'TIMEOUT' || s === 'TIME_LIMIT' || s === 'MEMORY_LIMIT' || s === 'MEMORY_LIMIT_EXCEEDED' || s === 'RUNTIME_ERROR' || s === 'COMPILE_ERROR' || s === 'SYSTEM_ERROR') statusColor = '#ef4444'; // Red
                        
                        div.innerHTML = `
                            <div style="font-weight:600;">${title}: <span style="color:${statusColor};">${r.status}</span></div>
                            <div style="font-size:11px;color:gray;">시간: ${r.executionTime || 0}ms</div>
                            ${r.output ? `<div>출력: ${r.output}</div>` : '<div>출력: </div>'}
                            ${r.error ? `<pre style="color:red;white-space:pre-wrap;font-size:11px;margin-top:5px;">${r.error}</pre>` : ''}
                        `;
                        display.appendChild(div);
                    });
                },
                
                toggleTheme() {
                    const body = document.body; const btn = document.getElementById('themeBtn');
                    if (this.currentTheme === 'light') { body.setAttribute('data-theme', 'dark'); this.currentTheme = 'dark'; btn.innerText = '☀️'; monaco.editor.setTheme('vs-dark'); }
                    else { body.removeAttribute('data-theme'); this.currentTheme = 'light'; btn.innerText = '🌙'; monaco.editor.setTheme('vs'); }
                },
                
                showTab(type) {
                    const panel = document.getElementById('bottom-panel');
                    if(panel) panel.style.display = 'flex';
                    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
                    const resDisp = document.getElementById('result-display');
                    const customArea = document.getElementById('custom-testcases-area');
                    if(resDisp) resDisp.style.display = 'none';
                    if(customArea) customArea.style.display = 'none';
                    if (type === 'result') { document.querySelector('.tab-item:nth-child(1)').classList.add('active'); if(resDisp) resDisp.style.display = 'block'; }
                    else { document.querySelector('.tab-item:nth-child(2)').classList.add('active'); if(customArea) customArea.style.display = 'block'; }
                    if(this.editor) this.editor.layout();
                },
                
                hideBottomPanel() { const panel = document.getElementById('bottom-panel'); if(panel) panel.style.display = 'none'; if(this.editor) this.editor.layout(); },
                
                tcIdx: 0,
                addTestCaseRow() {
                    this.tcIdx++; const row = document.createElement('div'); row.className = 'custom-case-row'; row.id = `tc-${this.tcIdx}`; row.style = "display:flex; gap:10px; margin-bottom:10px;";
                    row.innerHTML = `<textarea class="tc-in" placeholder="입력" style="flex:1; height:40px; background:var(--pg-bg); color:var(--pg-text); border:1px solid var(--pg-border);"></textarea><textarea class="tc-ex" placeholder="기대값" style="flex:1; height:40px; background:var(--pg-bg); color:var(--pg-text); border:1px solid var(--pg-border);"></textarea><button onclick="document.getElementById('tc-${this.tcIdx}').remove()" style="color:red; background:none; border:none; cursor:pointer; font-size:20px;">&times;</button>`;
                    document.getElementById('tc-list').appendChild(row);
                }
            };
            window.EditorCore = EditorCore;
            (function loadDockerScript() {
            	
            	const dataEl = document.getElementById('problem-data');                
                let isLinuxEnv = false; 
                if (dataEl) {
                    // HTML 속성으로 박힌 "true" 문자열을 자바스크립트 Boolean 값으로 변환합니다.
                    isLinuxEnv = dataEl.getAttribute('data-is-linux') === 'true';
                }                
                if (!isLinuxEnv) {
                    console.log("ℹ️ [도커 엔진] 서버 환경이 리눅스가 아니므로 비동기 채점 스크립트를 로드하지 않습니다.");
                    return;
                }
                
                console.log("⏳ editor-on-docker.js 동적 로드 시작...");
                const script = document.createElement('script');
                script.src = '/js/codingtest/editor-on-docker.js';
                
                // 💡 핵심: 파일이 '완전히 다운로드 된 직후'에 연달아 init을 실행하도록 보장합니다.
                script.onload = function() {
                    console.log("✅ editor-on-docker.js 로드 완료!");
                    if (typeof EditorOnDocker !== 'undefined') {
                        EditorOnDocker.init();
                    }
                };
                
                script.onerror = function() {
                    console.error("❌ 에러: editor-on-docker.js 파일을 불러오지 못했습니다.");
                };
                
                document.head.appendChild(script);
            })();
            
        })();

        function closeAiReview() { const el = document.getElementById('aiModal'); if(el) el.style.display = 'none'; }
        function closeSolvedModal() { const el = document.getElementById('solvedModal'); if(el) el.style.display = 'none'; }
        function loadPreviousSolution() { 
            const dataEl = document.getElementById('problem-data');
            if (window.EditorCore && window.EditorCore.editor) { 
                const prevCode = dataEl.getAttribute('data-prev-code');
                const prevLang = dataEl.getAttribute('data-prev-lang'); // 'java', 'python', 'cpp' 등
                
                // 에디터 내용 설정
                window.EditorCore.editor.setValue(prevCode); 

                // 언어 선택 UI 및 에디터 모드 동기화
                if (prevLang) {
                    const langSelect = document.getElementById('languageSelect');
                    if (langSelect) {
                        langSelect.value = prevLang;
                        // EditorCore 내부의 changeLanguage 로직을 활용하되 confirm은 건너뛰기 위해 직접 처리
                        const model = window.EditorCore.editor.getModel();
                        monaco.editor.setModelLanguage(model, prevLang === 'cpp' ? 'cpp' : (prevLang === 'python' ? 'python' : 'java'));
                    }
                }
            } 
            closeSolvedModal(); 
        }
    </script>
</body>
</html>
