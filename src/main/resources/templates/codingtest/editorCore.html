<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- [Passfail Editor Core] 공통 부품 및 라이브러리 -->

<head th:fragment="head(title, extraHead)">
    <meta charset="UTF-8">
    <title th:text="${title}">Passfail Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    
    <th:block th:replace="${extraHead}"></th:block>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <style>
        :root { 
            --pg-navy: #0f172a; 
            --pg-green: var(--primary-color, #22c55e); 
            --pg-bg: var(--bg-main, #f8fafc); 
            --pg-border: var(--border-color, #e2e8f0); 
            --pg-text: var(--text-main, #1e293b); 
            --pg-gray: var(--text-muted, #64748b); 
            --white: #ffffff; 
            --nav-text: #ffffff; 
        }

        [data-theme='dark'] { 
            --pg-bg: #020617; 
            --pg-navy: #000000; 
            --pg-border: #1e293b; 
            --pg-text: #f1f5f9; 
            --pg-gray: #94a3b8; 
            --white: #0f172a; 
            --nav-text: #f1f5f9; 
        }
        
        body, html { 
            margin: 0; 
            padding: 0;
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background-color: var(--pg-bg); 
            color: var(--pg-text); 
            font-family: var(--font-family); 
            display: flex; 
            flex-direction: column; 
        }

        .top-nav { 
            height: 50px; 
            min-height: 50px;
            background-color: var(--pg-navy); 
            color: var(--nav-text); 
            display: flex; 
            align-items: center; 
            padding: 0 24px; 
            justify-content: space-between; 
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        .top-nav h1 { font-size: 20px; margin: 0; font-weight: 900; letter-spacing: -0.05em; }
        .top-nav .problem-title { color: #ffffff; margin-left: 12px; font-weight: 700; font-size: 15px; opacity: 0.8; }

        .main-container { 
            display: flex; 
            flex: 1; 
            width: 100%;
            min-height: 0; 
            overflow: hidden;
            border-bottom: 1px solid var(--pg-border);
        }

        .left-panel { 
            width: 45%; 
            min-width: 300px;
            height: 100%; 
            overflow-y: auto; 
            border-right: 1px solid var(--pg-border); 
            background-color: var(--pg-bg);
        }
        .section-card { 
            background: var(--white); 
            border-bottom: 1px solid var(--pg-border); 
            padding: 24px; 
        }
        .section-header { 
            font-size: 15px; 
            font-weight: 800; 
            margin-bottom: 14px; 
            color: var(--pg-text); 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header::before {
            content: '';
            width: 4px;
            height: 15px;
            background: var(--pg-green);
            border-radius: 2px;
        }
        .section-content { 
            line-height: 1.7; 
            font-size: 14px; 
            color: var(--pg-text);
        }

        .right-panel { 
            flex: 1;
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            background: var(--white); 
            min-width: 0; 
        }
        #editor-container { 
            flex: 1; 
            width: 100%;
            min-height: 0;
        }

        .bottom-panel { 
            height: 280px; 
            background: var(--white); 
            flex-shrink: 0; 
            display: none; 
            flex-direction: column; 
            border-top: 1px solid var(--pg-border);
            z-index: 5;
        }

        .bottom-bar { 
            height: 50px; 
            min-height: 50px;
            background-color: var(--pg-navy); 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            justify-content: flex-end; 
            gap: 10px; 
            flex-shrink: 0; 
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        .btn-pg { 
            padding: 8px 20px; 
            border-radius: 6px; 
            border: none; 
            font-size: 12.5px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            min-width: 90px; 
            text-align: center; 
        }
        .btn-outline { 
            background: rgba(255,255,255,0.05); 
            color: white !important; 
            border: 1px solid rgba(255,255,255,0.2); 
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
        }
        .btn-blue { 
            background: var(--pg-green); 
            color: white !important; 
            box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.2);
        }
        .btn-blue:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .btn-ai { 
            background: #8b5cf6; 
            color: white !important; 
            display: none; 
        }
        
        .status-CORRECT { color: #22c55e; font-weight: 800; }
        .status-WRONG { color: #ef4444; font-weight: 800; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        .modal-content { 
            background: var(--white); 
            color: var(--pg-text); 
            margin: 5% auto; 
            padding: 40px; 
            border-radius: 20px; 
            width: 70%; 
            max-height: 80%; 
            overflow-y: auto; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--pg-border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--pg-gray); }
    </style>
</head>

<body>
    <!-- (상단 네비게이션, 문제 패널, 결과창 패널 fragment들은 기존과 동일하게 유지) -->
    <div th:fragment="topNav" class="top-nav">
        <h1><a href="/main" style="color: #ffffff; text-decoration: none;">Passfail</a> <span class="problem-title" th:text="${problem.title}">Title</span></h1>
        <div style="display:flex; align-items:center; gap:15px;">
            <button onclick="EditorCore.toggleTheme()" id="themeBtn" style="background:none; border:none; color:white; cursor:pointer; font-size:18px; outline:none;">🌙</button>
        </div>
    </div>
    <div th:fragment="problemPanel" class="left-panel" id="problem-sections"></div>
    <div th:fragment="bottomPanel" class="bottom-panel" id="bottom-panel">
        <div class="tab-menu">
            <div class="tab-item active" onclick="EditorCore.showTab('result')">실행 결과</div>
            <div class="tab-item" onclick="EditorCore.showTab('custom')">테스트 케이스 추가</div>
            <div style="margin-left:auto; padding-right:15px; display:flex; align-items:center;">
                <span style="font-size:11px; color:var(--pg-gray); cursor:pointer;" onclick="EditorCore.hideBottomPanel()">접기 ▾</span>
            </div>
        </div>
        <div id="result-display" class="result-panel"></div>
        <div id="custom-testcases-area" class="result-panel" style="display:none;">
            <div id="tc-list"></div>
            <button class="btn-pg btn-outline" style="color:var(--pg-text) !important; border-color:var(--pg-border);" onclick="EditorCore.addTestCaseRow()">+ 추가하기</button>
        </div>
    </div>

    <script th:fragment="scripts">
        const EditorCore = {
            editor: null, currentTheme: 'light', lastResults: null,
            init(config) {
                const dataEl = document.getElementById('problem-data');
                this.renderSections(dataEl.getAttribute('data-desc'), dataEl.getAttribute('data-time'), dataEl.getAttribute('data-mem'));
                require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
                require(['vs/editor/editor.main'], () => {
                    this.editor = monaco.editor.create(document.getElementById('editor-container'), {
                        value: dataEl.getAttribute('data-code'), language: 'java', theme: 'vs', automaticLayout: true, fontSize: 14, minimap: { enabled: false }
                    });
                    if (dataEl.getAttribute('data-is-solved') === 'true') document.getElementById('solvedModal').style.display = 'block';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    if (config && config.onEditorLoaded) config.onEditorLoaded(this.editor);
                });
            },
            renderSections(desc, time, mem) {
                const container = document.getElementById('problem-sections');
                if (!container) return;
                desc.split('### ').filter(p => p.trim() !== "").forEach(part => {
                    const lines = part.split('\n');
                    const card = document.createElement('div');
                    card.className = 'section-card';
                    card.innerHTML = `<div class="section-header">${lines[0].trim()}</div><div class="section-content">${lines.slice(1).join('\n').trim().replace(/\n/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>')}</div>`;
                    container.appendChild(card);
                });
                const constCard = document.createElement('div');
                constCard.className = 'section-card';
                constCard.innerHTML = `<div class="section-header">제한 사항</div><div class="section-content"><ul><li>시간 제한: ${time}ms</li><li>메모리 제한: ${mem}MB</li></ul></div>`;
                container.appendChild(constCard);
            },
            async runCode() {
                const dataEl = document.getElementById('problem-data');
                if (dataEl.getAttribute('data-is-logged-in') !== 'true') { if(confirm('코드 실행은 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) window.location.href='/login'; return; }
                this.showTab('result');
                const display = document.getElementById('result-display');
                display.innerHTML = '코드 실행 중...';
                const customTC = [];
                document.querySelectorAll('.custom-case-row').forEach(row => customTC.push({ input: row.querySelector('.tc-in').value, expected: row.querySelector('.tc-ex').value }));
                try {
                    const res = await fetch(`/codingtest/${dataEl.getAttribute('data-id')}/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: this.editor.getValue(), customTestCases: customTC }) });
                    this.displayResults(await res.json());
                } catch (e) { display.innerHTML = '에러 발생'; }
            },
            async submitCode(onSuccess) {
                const dataEl = document.getElementById('problem-data');
                if (dataEl.getAttribute('data-is-logged-in') !== 'true') { if(confirm('채점 및 제출은 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) window.location.href='/login'; return; }
                this.showTab('result');
                const display = document.getElementById('result-display');
                display.innerHTML = '채점 중...';
                try {
                    const res = await fetch(`/codingtest/${dataEl.getAttribute('data-id')}/submit`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: this.editor.getValue() }) });
                    const data = await res.json();
                    if (data.error) { display.innerHTML = `서버 오류: ${data.error}`; return; }
                    this.displayResults(data.results);
                    if (data.allCorrect) {
                        document.getElementById('aiReviewBtn').style.display = 'block';
                        this.lastResults = data.results;
                        if (onSuccess) onSuccess(data); else alert('정답입니다!');
                    }
                } catch (e) { display.innerHTML = '제출 중 에러 발생'; }
            },
            displayResults(results) {
                const display = document.getElementById('result-display');
                const officialTCCount = parseInt(document.getElementById('problem-data').getAttribute('data-tc-count'));
                display.innerHTML = '';
                results.forEach((r, i) => {
                    const div = document.createElement('div');
                    div.className = 'test-case-row';
                    let title = i < officialTCCount ? `기본 테스트 ${i+1}` : `커스텀 테스트 ${i - officialTCCount + 1}`;
                    div.innerHTML = `<div style="font-weight:600;">${title}: <span class="status-${r.status}">${r.status}</span></div><div style="font-size:11px;color:gray;">시간: ${r.executionTime || 0}ms</div>${r.output ? `<div>출력: ${r.output}</div>` : ''}${r.error ? `<pre style="color:red;white-space:pre-wrap;">${r.error}</pre>` : ''}`;
                    display.appendChild(div);
                });
            },
            toggleTheme() {
                const body = document.body; const btn = document.getElementById('themeBtn');
                if (this.currentTheme === 'light') { body.setAttribute('data-theme', 'dark'); this.currentTheme = 'dark'; btn.innerText = '☀️'; monaco.editor.setTheme('vs-dark'); }
                else { body.removeAttribute('data-theme'); this.currentTheme = 'light'; btn.innerText = '🌙'; monaco.editor.setTheme('vs'); }
            },
            showTab(type) {
                document.getElementById('bottom-panel').style.display = 'flex';
                document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
                document.getElementById('result-display').style.display = 'none';
                document.getElementById('custom-testcases-area').style.display = 'none';
                if (type === 'result') { document.querySelector('.tab-item:nth-child(1)').classList.add('active'); document.getElementById('result-display').style.display = 'block'; }
                else { document.querySelector('.tab-item:nth-child(2)').classList.add('active'); document.getElementById('custom-testcases-area').style.display = 'block'; }
                if(this.editor) this.editor.layout();
            },
            hideBottomPanel() { document.getElementById('bottom-panel').style.display = 'none'; if(this.editor) this.editor.layout(); },
            tcIdx: 0,
            addTestCaseRow() {
                this.tcIdx++; const row = document.createElement('div'); row.className = 'custom-case-row'; row.id = `tc-${this.tcIdx}`; row.style = "display:flex; gap:10px; margin-bottom:10px;";
                row.innerHTML = `<textarea class="tc-in" placeholder="입력" style="flex:1; height:40px; background:var(--pg-bg); color:var(--pg-text); border:1px solid var(--pg-border);"></textarea><textarea class="tc-ex" placeholder="기대값" style="flex:1; height:40px; background:var(--pg-bg); color:var(--pg-text); border:1px solid var(--pg-border);"></textarea><button onclick="document.getElementById('tc-${this.tcIdx}').remove()" style="color:red; background:none; border:none; cursor:pointer; font-size:20px;">&times;</button>`;
                document.getElementById('tc-list').appendChild(row);
            },
            async openAiReview() {
                const dataEl = document.getElementById('problem-data');
                if (dataEl.getAttribute('data-is-logged-in') !== 'true') { if(confirm('AI 리뷰는 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) window.location.href='/login'; return; }
                if (!confirm('AI 코드 리뷰를 요청하시겠습니까? (2000 바나나 소모)')) return;

                const content = document.getElementById('ai-content');
                document.getElementById('aiModal').style.display = 'block';
                content.innerHTML = '분석 중...';
                try {
                    const res = await fetch(`/codingtest/${dataEl.getAttribute('data-id')}/ai-review`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: this.editor.getValue(), results: this.lastResults }) });
                    const data = await res.json();
                    
                    if (data.review.startsWith('❌ 오류: 잔액이 부족합니다')) {
                        alert('포인트가 부족합니다.');
                        document.getElementById('aiModal').style.display = 'none';
                        return;
                    }
                    
                    content.innerHTML = data.review.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                } catch (e) { 
                    content.innerHTML = '실패';
                    alert('리뷰 요청 중 오류가 발생했습니다.');
                }
            },
            async downloadPdf() {
                const dataEl = document.getElementById('problem-data');
                const problemId = dataEl.getAttribute('data-id');
                if (dataEl.getAttribute('data-is-logged-in') !== 'true') { 
                    if(confirm('PDF 다운로드는 로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) window.location.href='/login'; 
                    return; 
                }
                
                if (!confirm('문제를 PDF로 다운로드하시겠습니까? (1,000 바나나 소모)')) return;

                try {
                    const response = await fetch(`/problem/${problemId}/download`);
                    
                    if (response.ok) {
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `Problem_${problemId}.pdf`;
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                    } else {
                        const errorData = await response.json();
                        alert(errorData.message || '포인트가 부족하거나 다운로드에 실패했습니다.');
                    }
                } catch (error) {
                    console.error('PDF download error:', error);
                    alert('다운로드 중 오류가 발생했습니다.');
                }
            }
        };
        function closeAiReview() { document.getElementById('aiModal').style.display = 'none'; }
        function closeSolvedModal() { document.getElementById('solvedModal').style.display = 'none'; }
        function loadPreviousSolution() { if (EditorCore.editor) { EditorCore.editor.setValue(document.getElementById('problem-data').getAttribute('data-prev-code')); } closeSolvedModal(); }
    </script>
</body>
</html>
