<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환불 요청 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <div th:replace="~{fragments/navbar :: navbarStyles}"></div>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background: #f8fafc; color: #1e293b; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="flex flex-col min-height-screen">
    <div th:replace="~{fragments/navbar :: mainNavbar}"></div>

    <main class="flex-1 max-w-4xl mx-auto w-full px-6 py-12">
        <div class="mb-10">
            <h1 class="text-3xl font-black text-slate-800">환불 요청</h1>
            <p class="text-slate-500 font-bold mt-2">최근 결제 내역 중 환불 가능한 목록입니다.</p>
        </div>

        <div class="glass-card p-8">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b-2 border-slate-100">
                        <th class="py-4 font-black text-slate-500 text-sm uppercase">결제일</th>
                        <th class="py-4 font-black text-slate-500 text-sm uppercase">충전 포인트</th>
                        <th class="py-4 font-black text-slate-500 text-sm uppercase">결제 금액</th>
                        <th class="py-4 font-black text-slate-500 text-sm uppercase text-center">작업</th>
                    </tr>
                </thead>
                <tbody class="text-sm font-bold text-slate-600">
                    <tr th:each="payment : ${payments}" class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="py-6" th:text="${#temporals.format(payment.paidAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                        <td class="py-6">
                            <span class="text-green-600" th:text="${#numbers.formatInteger(payment.pointCharged, 0, 'COMMA')} + ' 바나나'">10,000 바나나</span>
                        </td>
                        <td class="py-6" th:text="${#numbers.formatInteger(payment.amount, 0, 'COMMA')} + '원'">11,000원</td>
                        <td class="py-6 text-center">
                            <button th:onclick="'requestRefund(' + ${payment.paymentId} + ')'" 
                                    class="px-4 py-2 bg-red-50 text-red-600 rounded-xl hover:bg-red-100 transition-all">
                                환불하기
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${payments.empty}">
                        <td colspan="4" class="py-20 text-center text-slate-400 font-bold">환불 가능한 결제 내역이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-8 p-6 bg-amber-50 rounded-2xl border border-amber-100">
            <h4 class="font-black text-amber-800 mb-2 flex items-center gap-2">
                <i data-lucide="alert-circle" size="18"></i> 환불 주의사항
            </h4>
            <ul class="text-sm text-amber-700 font-bold space-y-1">
                <li>• 충전 시 지급된 포인트가 현재 잔액보다 많을 경우 환불이 불가능합니다.</li>
                <li>• 환불 시 해당 결제로 지급된 포인트는 전액 회수됩니다.</li>
                <li>• 카카오페이 API 정책에 따라 부분 취소는 지원하지 않습니다.</li>
            </ul>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function requestRefund(paymentId) {
            if (!confirm('정말로 환불하시겠습니까? 해당 포인트가 즉시 회수됩니다.')) return;

            fetch(`/payment/refund/${paymentId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(async response => {
                if (response.ok) {
                    alert('환불이 성공적으로 처리되었습니다.');
                    location.reload();
                } else {
                    const error = await response.text();
                    alert('환불 실패: ' + error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('네트워크 오류가 발생했습니다.');
            });
        }
    </script>
    <script th:replace="~{fragments/navbar :: navbarScript}"></script>
</body>
</html>
