<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passfail - 성장을 위한 코딩 학습</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #f8fafc 0%, #f1fdf4 100%);
            color: #1e293b;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 40px;
        }
        
        .tab-active { 
            background: white; 
            color: #16a34a; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .duo-btn {
            border-bottom: 5px solid rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .duo-btn:active { transform: translateY(3px); border-bottom-width: 2px; }

        .sidebar-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
    <!-- Navbar styles from fragment -->
    <div th:replace="~{fragments/navbar :: navbarStyles}"></div>
</head>
<body class="flex flex-col">

    <!-- 1. 고정 네비게이션 바 (Sticky Header) - Replaced with fragment -->
    <div th:replace="~{fragments/navbar :: mainNavbar}"></div>

    <!-- 2. 메인 화면 (Main Content) -->
    <main id="view-main" class="flex-1 max-w-7xl mx-auto w-full px-6 pt-20 pb-20">
        <div class="text-center mb-20">
            <h1 class="text-6xl font-black mb-10 tracking-tighter text-slate-800">당신의 성장을 위한 <span class="text-green-600">최적의 경로</span></h1>
            
            <div class="inline-flex bg-slate-200/40 p-2.5 rounded-[2.5rem] shadow-inner">
                <button onclick="switchTab('beginner')" id="tab-beginner" class="tab-active px-20 py-7 rounded-[2rem] text-2xl font-black transition-all">
                    입문자 시작하기
                </button>
                <button onclick="switchTab('jobtest')" id="tab-jobtest" class="px-20 py-7 rounded-[2rem] text-2xl font-black transition-all text-slate-400">
                    입사 시험 테스트
                </button>
            </div>
        </div>
        
        <div id="content-beginner" class="grid grid-cols-1 md:grid-cols-2 gap-12"></div>
        <div id="content-jobtest" class="hidden grid grid-cols-1 md:grid-cols-2 gap-12"></div>
    </main>

    <!-- AI 질의응답 사이드바 -->
    <aside id="ai-sidebar" class="hidden" aria-hidden="true">
        <div class="flex items-center">
            <div class="bg-green-grad text-white p-5 rounded-l-[2.5rem] cursor-pointer flex flex-col items-center gap-3 shadow-2xl">
                <i data-lucide="sparkles" size="24" class="animate-pulse"></i>
                <span style="writing-mode: vertical-lr;" class="text-[11px] font-black tracking-widest uppercase">AI Mentor</span>
            </div>
            <div class="bg-white/95 backdrop-blur-2xl w-[350px] h-[600px] border-l-4 border-green-500 rounded-l-[2.5rem] p-8 flex flex-col shadow-2xl">
                <h3 class="font-black text-2xl mb-8 text-slate-800 flex items-center gap-3">
                    <i data-lucide="bot" class="text-green-500"></i> AI 멘토
                </h3>
                <div class="flex-1 bg-slate-50 border border-slate-100 rounded-3xl p-6 text-sm font-bold text-slate-400 overflow-y-auto mb-8 shadow-inner">
                    <span th:text="${username != null ? username : '게스트'}">동엽</span>님, 알고리즘 풀이 중 막히는 부분이 있나요? 무엇이든 물어보세요!
                </div>
                <div class="relative">
                    <input type="text" placeholder="질문을 입력하세요..." class="w-full border-2 border-slate-100 rounded-2xl p-4 text-sm outline-none focus:border-green-500 transition-all font-bold">
                    <button class="absolute right-3 top-3 p-2.5 bg-green-grad text-white rounded-xl shadow-lg"><i data-lucide="send" size="18"></i></button>
                </div>
            </div>
        </div>
    </aside>

    <th:block th:replace="~{aiQuestion :: aiQuestion}"></th:block>

    <footer class="py-16 text-center border-t border-slate-200 text-slate-300 font-black text-xs tracking-widest uppercase mt-auto">
        &copy; 2026 Passfail Learning Platform. All rights reserved.
    </footer>

    <script>
        const cardData = {
            beginner: [
                { title: "파이썬 기초 입문", desc: "가장 직관적인 언어로 코딩 세계에 첫 발을 내딛으세요.", icon: "zap", color: "text-amber-500", bg: "bg-amber-50" },
                { title: "자바 핵심 마스터", desc: "실무 백엔드 개발을 위한 가장 강력한 도구를 익힙니다.", icon: "coffee", color: "text-orange-700", bg: "bg-orange-50" }
            ],
            jobtest: [
                { title: "네이버 실전 코테", desc: "검색 엔진 개발자들이 실제 마주하는 난이도와 유형.", icon: "code", color: "text-green-600", bg: "bg-green-50" },
                { title: "카카오 테크 챌린지", desc: "창의적이고 복잡한 로직을 해결하는 역량 집중 훈련.", icon: "layout", color: "text-yellow-500", bg: "bg-yellow-50" }
            ]
        };

        function init() {
            const renderCards = (type, targetId) => {
                const target = document.getElementById(targetId);
                cardData[type].forEach(c => {
                    const card = document.createElement('div');
                    card.className = "glass-card p-12 hover:scale-[1.03] cursor-pointer transition-all duration-300 shadow-xl group border-2 border-transparent hover:border-green-200";
                    card.onclick = () => location.href = '/problem/problemList';
                    card.innerHTML = `
                        <div class="w-20 h-20 ${c.bg} border border-slate-100 rounded-3xl flex items-center justify-center mb-8 ${c.color} group-hover:scale-110 transition-transform">
                            <i data-lucide="${c.icon}" size="36"></i>
                        </div>
                        <h3 class="text-3xl font-black mb-4 text-slate-800">${c.title}</h3>
                        <p class="font-bold text-slate-400 leading-relaxed text-sm">${c.desc}</p>
                    `;
                    target.appendChild(card);
                });
            };
            renderCards('beginner', 'content-beginner');
            renderCards('jobtest', 'content-jobtest');

            lucide.createIcons();
        }

        function switchTab(tab) {
            const isBeginner = tab === 'beginner';
            document.getElementById('tab-beginner').classList.toggle('tab-active', isBeginner);
            document.getElementById('tab-jobtest').classList.toggle('tab-active', !isBeginner);
            document.getElementById('tab-jobtest').classList.toggle('text-slate-400', isBeginner);
            document.getElementById('tab-beginner').classList.toggle('text-slate-400', !isBeginner);
            
            document.getElementById('content-beginner').classList.toggle('hidden', !isBeginner);
            document.getElementById('content-jobtest').classList.toggle('hidden', isBeginner);
        }

        window.onload = init;
    </script>
    <!-- Navbar scripts from fragment -->
    <script th:replace="~{fragments/navbar :: navbarScript}"></script>
</body>
</html>
