<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passfail - 성장을 위한 코딩 학습</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #f8fafc 0%, #f1fdf4 100%);
            color: #1e293b;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 40px;
        }
        
        .tab-active { 
            background: white; 
            color: #16a34a; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .duo-btn {
            border-bottom: 5px solid rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .duo-btn:active { transform: translateY(3px); border-bottom-width: 2px; }

        .sidebar-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
    <!-- Navbar styles from fragment -->
    <div th:replace="~{fragments/navbar :: navbarStyles}"></div>
</head>
<body class="flex flex-col">

    <!-- 1. 고정 네비게이션 바 (Sticky Header) - Replaced with fragment -->
    <div th:replace="~{fragments/navbar :: mainNavbar}"></div>

    <!-- 2. 메인 화면 (Main Content) -->
    <main id="view-main" class="flex-1 max-w-7xl mx-auto w-full px-6 pt-20 pb-20">
        <div class="text-center mb-20">
            <h1 class="text-6xl font-black mb-10 tracking-tighter text-slate-800">당신의 성장을 위한 <span class="text-green-600">최적의 경로</span></h1>
            <p class="text-xl font-bold text-slate-400">학습부터 실전 대비까지, 모든 과정을 함께합니다.</p>
        </div>
        
        <!-- 3개 섹션 카드 레이아웃 -->
        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 gap-8">
            <!-- 1. 문제 -->
            <div class="glass-card p-10 hover:scale-[1.05] cursor-pointer transition-all duration-300 shadow-xl group border-2 border-transparent hover:border-green-200 flex flex-col items-center text-center" onclick="location.href='/problem/problemList'">
                <div class="w-20 h-20 bg-green-50 border border-slate-100 rounded-3xl flex items-center justify-center mb-8 text-green-600 group-hover:scale-110 transition-transform">
                    <i data-lucide="code" size="36"></i>
                </div>
                <h3 class="text-2xl font-black mb-4 text-slate-800">문제</h3>
                <p class="font-bold text-slate-400 leading-relaxed text-sm">실전 감각을 키워줄 다양한 문제들을 풀어보세요.</p>
            </div>

            <!-- 2. 게시판 -->
            <div class="glass-card p-10 hover:scale-[1.05] cursor-pointer transition-all duration-300 shadow-xl group border-2 border-transparent hover:border-green-200 flex flex-col items-center text-center" onclick="location.href='/board'">
                <div class="w-20 h-20 bg-amber-50 border border-slate-100 rounded-3xl flex items-center justify-center mb-8 text-amber-500 group-hover:scale-110 transition-transform">
                    <i data-lucide="layout" size="36"></i>
                </div>
                <h3 class="text-2xl font-black mb-4 text-slate-800">게시판</h3>
                <p class="font-bold text-slate-400 leading-relaxed text-sm">지식을 공유하고 함께 고민하며 성장하세요.</p>
            </div>

            <!-- 3. 랭킹 -->
            <div class="glass-card p-10 hover:scale-[1.05] cursor-pointer transition-all duration-300 shadow-xl group border-2 border-transparent hover:border-green-200 flex flex-col items-center text-center" onclick="location.href='/ranking'">
                <div class="w-20 h-20 bg-purple-50 border border-slate-100 rounded-3xl flex items-center justify-center mb-8 text-purple-600 group-hover:scale-110 transition-transform">
                    <i data-lucide="trophy" size="36"></i>
                </div>
                <h3 class="text-2xl font-black mb-4 text-slate-800">랭킹</h3>
                <p class="font-bold text-slate-400 leading-relaxed text-sm">다른 사용자들과 경쟁하며 자신의 위치를 확인하세요.</p>
            </div>
        </div>
    </main>

    <!-- AI 질의응답 사이드바 -->
    <aside id="ai-sidebar" class="hidden" aria-hidden="true">
        <div class="flex items-center">
            <div class="bg-green-grad text-white p-5 rounded-l-[2.5rem] cursor-pointer flex flex-col items-center gap-3 shadow-2xl">
                <i data-lucide="sparkles" size="24" class="animate-pulse"></i>
                <span style="writing-mode: vertical-lr;" class="text-[11px] font-black tracking-widest uppercase">AI Mentor</span>
            </div>
            <div class="bg-white/95 backdrop-blur-2xl w-[350px] h-[600px] border-l-4 border-green-500 rounded-l-[2.5rem] p-8 flex flex-col shadow-2xl">
                <h3 class="font-black text-2xl mb-8 text-slate-800 flex items-center gap-3">
                    <i data-lucide="bot" class="text-green-500"></i> AI 멘토
                </h3>
                <div class="flex-1 bg-slate-50 border border-slate-100 rounded-3xl p-6 text-sm font-bold text-slate-400 overflow-y-auto mb-8 shadow-inner">
                    <span th:text="${currentUsername != null ? currentUsername : '게스트'}">동엽</span>님, 알고리즘 풀이 중 막히는 부분이 있나요? 무엇이든 물어보세요!
                </div>
                <div class="relative">
                    <input type="text" placeholder="질문을 입력하세요..." class="w-full border-2 border-slate-100 rounded-2xl p-4 text-sm outline-none focus:border-green-500 transition-all font-bold">
                    <button class="absolute right-3 top-3 p-2.5 bg-green-grad text-white rounded-xl shadow-lg"><i data-lucide="send" size="18"></i></button>
                </div>
            </div>
        </div>
    </aside>

    <th:block th:replace="~{aiQuestion :: aiQuestion}"></th:block>

    <footer class="py-16 text-center border-t border-slate-200 text-slate-300 font-black text-xs tracking-widest uppercase mt-auto">
        &copy; 2026 Passfail Learning Platform. All rights reserved.
    </footer>

    <script>
        function init() {
            lucide.createIcons();
        }
        window.onload = init;
    </script>
    <!-- Navbar scripts from fragment -->
    <script th:replace="~{fragments/navbar :: navbarScript}"></script>
</body>
</html>
