<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'검색 결과: ' + ${query}">Passfail - 검색 결과</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style th:replace="~{fragments/navbar :: navbarStyles}"></style>
    <style>
        .result-section {
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .result-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.2s;
            cursor: pointer;
            display: block;
            text-decoration: none;
            color: inherit;
        }
        .result-card:hover {
            border-color: #22c55e;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.1);
        }
        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-problem { background: #f0fdf4; color: #16a34a; }
        .badge-post { background: #f1f5f9; color: #475569; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div th:replace="~{fragments/navbar :: mainNavbar}"></div>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <header class="mb-12">
            <h1 class="text-3xl font-black text-slate-800 mb-2">
                "<span class="text-green-600" th:text="${query}">query</span>" 검색 결과
            </h1>
            <p class="text-slate-500 font-bold" th:text="'총 ' + (${#lists.size(problems)} + ${#lists.size(posts)}) + '개의 결과를 찾았습니다.'"></p>
        </header>

        <!-- Problem Results -->
        <section class="result-section" th:if="${not #lists.isEmpty(problems)}">
            <div class="section-title">
                <i data-lucide="code-2" class="text-green-600"></i>
                문제
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <a th:each="p : ${problems}" th:href="@{/codingtest/{id}(id=${p.problemId})}" class="result-card">
                    <div class="flex justify-between items-start mb-3">
                        <span class="badge badge-problem">Problem</span>
                        <span class="text-xs font-bold text-slate-400" th:text="${p.difficulty}">Easy</span>
                    </div>
                    <h3 class="font-black text-slate-800 text-lg mb-2" th:text="${p.title}">Title</h3>
                    <p class="text-slate-500 text-sm line-clamp-2" th:text="${p.description}">Description</p>
                </a>
            </div>
        </section>

        <!-- Post Results -->
        <section class="result-section" th:if="${not #lists.isEmpty(posts)}">
            <div class="section-title">
                <i data-lucide="layout-list" class="text-slate-600"></i>
                게시판
            </div>
            <div class="space-y-4">
                <a th:each="post : ${posts}" th:href="@{/posts/{id}/view(id=${post.postId})}" class="result-card">
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center gap-3">
                            <span class="badge badge-post" th:text="${post.category}">Notice</span>
                            <span class="text-sm font-black text-slate-800" th:text="${post.title}">Title</span>
                        </div>
                        <span class="text-xs font-bold text-slate-400" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2024-05-19</span>
                    </div>
                    <div class="flex items-center gap-4 text-xs font-bold text-slate-400">
                        <span th:text="'작성자: ' + ${post.authorNickname}">Author</span>
                        <span th:text="'조회수: ' + ${post.viewCount}">0</span>
                    </div>
                </a>
            </div>
        </section>

        <!-- No Results -->
        <div th:if="${#lists.isEmpty(problems) and #lists.isEmpty(posts)}" class="text-center py-24 bg-white rounded-3xl border border-slate-200">
            <i data-lucide="search-x" class="mx-auto text-slate-300 mb-6" size="64"></i>
            <h2 class="text-2xl font-black text-slate-800 mb-2">검색 결과가 없습니다.</h2>
            <p class="text-slate-400 font-bold">다른 키워드로 검색해보세요.</p>
        </div>
    </main>

    <div th:replace="~{fragments/navbar :: navbarScript}"></div>
</body>
</html>
