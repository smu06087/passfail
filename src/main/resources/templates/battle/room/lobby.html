<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passfail - 대기실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style th:fragment="navbarStyles">
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #f8fafc 0%, #f1fdf4 100%);
            color: #1e293b;
            min-height: 100vh;
        }

        .bg-green-grad { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
        }

        .duo-btn {
            border-bottom: 5px solid rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .duo-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    </style>
    <!-- Navbar styles from fragment -->
    <div th:replace="~{fragments/navbar :: navbarStyles}"></div>
</head>
<body class="flex flex-col">

    <!-- 고정 네비게이션 바 (Sticky Header) - Replaced with fragment -->
    <div th:replace="~{fragments/navbar :: mainNavbar}"></div>

    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-6">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-slate-800 mb-1">배틀 <span class="text-green-600">로비</span></h1>
                <p class="text-slate-500 font-bold text-sm">전 세계 개발자들과 실시간으로 실력을 겨뤄보세요.</p>
            </div>
            
            <div class="flex gap-3">
                <button id="quick-match-btn" class="duo-btn bg-green-grad text-white px-6 py-3 rounded-xl font-black text-base flex items-center gap-2 shadow-lg shadow-green-500/20">
                    <i data-lucide="zap" size="18"></i> 빠른 매칭
                </button>
                <a href="/battle/room/create" class="duo-btn bg-white border-2 border-slate-200 text-slate-700 px-6 py-3 rounded-xl font-black text-base flex items-center gap-2 shadow-md hover:border-green-400 transition-all">
                    <i data-lucide="plus" size="18"></i> 방 생성
                </a>
            </div>
        </div>

        <!-- Filter & Search Section -->
        <div class="glass-card p-5 mb-8 flex flex-wrap items-center gap-6 shadow-xl">
            <div class="flex items-center gap-3 bg-white border border-slate-200 rounded-xl px-4 py-2 flex-1 min-w-[300px]">
                <i data-lucide="search" size="18" class="text-slate-400"></i>
                <input type="text" id="search-input" th:value="${search}" placeholder="방 제목 또는 태그 검색 (예: 초보 #자료구조)" class="w-full bg-transparent outline-none font-bold text-slate-600">
            </div>
            
            <label class="flex items-center gap-2 cursor-pointer group">
                <input type="checkbox" id="enterable-only-check" th:checked="${enterableOnly}" class="w-5 h-5 accent-green-600 rounded">
                <span class="font-bold text-slate-600 group-hover:text-green-600 transition-colors">참여 가능한 방만 보기</span>
            </label>
        </div>

        <div class="roomlist-header flex items-center gap-3 mb-4">
            <i data-lucide="list" class="text-green-600" size="20"></i>
            <h2 class="text-xl font-black text-slate-800">참여 가능한 대결</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Room Cards -->
            <div th:each="room : ${rooms}" 
                 class="glass-card p-8 hover:scale-[1.02] transition-all duration-300 shadow-lg group border-2 border-transparent hover:border-green-200 flex flex-col h-full relative overflow-hidden">
                
                <!-- Status & ID Overlay -->
                <div class="absolute top-0 left-0 bg-slate-800 text-white px-3 py-1 rounded-br-xl text-[10px] font-black tracking-widest uppercase">
                    ID: [[${room.roomId}]]
                </div>

                <div class="flex justify-between items-start mb-6 mt-2">
                    <div class="w-12 h-12 bg-green-50 border border-green-100 rounded-2xl flex items-center justify-center text-green-600">
                        <i th:if="${room.hasPassword}" data-lucide="lock" size="24"></i>
                        <i th:if="${!room.hasPassword}" data-lucide="code" size="24"></i>
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <div class="flex items-center gap-2 bg-slate-100 px-3 py-1 rounded-full text-xs font-black text-slate-500">
                            <i data-lucide="users" size="14"></i>
                            <span th:text="${room.currentParticipantsCount + ' / ' + room.maxParticipants}">0 / 8</span>
                        </div>
                        <span th:class="'px-3 py-1 rounded-full text-[10px] font-black uppercase ' + 
                                     (${room.status.name() == 'WAITING'} ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600')"
                              th:text="${room.status.name() == 'WAITING' ? '대기 중' : '시작됨'}">
                            대기 중
                        </span>
                    </div>
                </div>
                
                <h3 class="text-2xl font-black mb-2 text-slate-800 leading-tight" th:text="${room.roomName}">방 제목</h3>
                
                <!-- Combined Tags & Difficulty -->
                <div class="flex flex-wrap gap-2 mb-4">
                    <span class="text-[10px] font-black bg-blue-100 text-blue-600 px-2 py-0.5 rounded-md" 
                          th:text="${room.battleMode.description}">모드</span>
                    <span class="text-[10px] font-black bg-green-100 text-green-600 px-2 py-0.5 rounded-md" 
                          th:text="'#' + ${room.difficulty}">#EASY</span>
                    <span th:each="tag : ${#strings.arraySplit(room.tags != null ? room.tags : '', ',')}" 
                          th:if="${!#strings.isEmpty(tag)}"
                          class="text-[10px] font-bold bg-slate-100 text-slate-400 px-2 py-0.5 rounded-md" 
                          th:text="'#' + ${tag.trim()}">#태그</span>
                </div>
                
                <div class="mt-auto pt-6 flex items-center justify-end border-t border-slate-50">
                 <button th:data-room-id="${room.roomId}" th:data-has-password="${room.hasPassword}" th:data-status="${room.status.name()}"
					    onclick="joinRoom(this)"
					    class="px-6 py-2 bg-slate-800 text-white rounded-xl font-black text-sm hover:bg-green-600 transition-colors shadow-lg shadow-slate-900/10">
					    참여하기
					</button>
                </div>
            </div>
        </div>

        <div th:if="${rooms.empty}" class="py-32 text-center">
            <div class="w-20 h-20 bg-slate-100 rounded-3xl flex items-center justify-center mx-auto mb-6">
                <i data-lucide="search-x" class="text-slate-300" size="40"></i>
            </div>
            <h3 class="text-2xl font-black text-slate-800 mb-2">검색 결과가 없습니다.</h3>
            <p class="text-slate-400 font-bold">다른 검색어를 입력하거나 직접 방을 만들어 보세요!</p>
        </div>
    </main>

    <!-- Quick Match Modal -->
    <div id="quick-match-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-6">
        <div id="modal-bg" class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
        <div class="glass-card w-full max-w-lg p-10 relative z-10 shadow-2xl animate-in zoom-in-95 duration-200">
            <button id="close-modal-btn" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="x" size="24"></i>
            </button>
            
            <h2 class="text-3xl font-black text-slate-800 mb-8 flex items-center gap-3">
                <i data-lucide="zap" class="text-green-600 fill-green-600"></i> 빠른 매칭
            </h2>
            
            <form action="/battle/room/quick-match" method="POST" id="quick-match-form">
                <div class="space-y-6 mb-10">
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">모드 선택</label>
                        <select name="mode" class="w-full bg-slate-100 border-2 border-transparent focus:border-green-500 rounded-2xl p-4 outline-none font-bold text-slate-700 transition-all appearance-none">
                            <option value="ALL">모든 모드</option>
                            <option value="QUICK">빨리 풀기</option>
                            <option value="MANY">많이 풀기</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">난이도 선택</label>
                        <select name="difficulty" class="w-full bg-slate-100 border-2 border-transparent focus:border-green-500 rounded-2xl p-4 outline-none font-bold text-slate-700 transition-all appearance-none">
                            <option value="ALL">모든 난이도</option>
                            <option value="EASY">EASY</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HARD">HARD</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full duo-btn bg-green-grad text-white py-6 rounded-3xl font-black text-2xl tracking-tighter shadow-2xl shadow-green-500/40 hover:scale-[1.02] transition-transform">
                    빠른 참가하기
                </button>
            </form>
        </div>
    </div>

    <footer class="py-16 text-center border-t border-slate-200 text-slate-300 font-black text-xs tracking-widest uppercase mt-auto">
        &copy; 2026 Passfail Learning Platform. All rights reserved.
    </footer>

    <script th:inline="javascript">
        // Check for error messages
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error === 'wrong_password') {
            alert("비밀번호가 틀렸습니다.");
        } else if (error === 'no_match_found') {
            alert("적합한 방을 찾지 못했습니다. 직접 방을 만들어 보세요!");
        } else if (error === 'already_started') {
            alert("이미 시작된 방에는 입장할 수 없습니다.");
        }

        async function joinRoom(btn) {
        	
        	const roomId = btn.dataset.roomId;
            const hasPassword = btn.dataset.hasPassword === "true";
            const status = btn.dataset.status;
            
            // 1. 방 상태 확인
            if (status !== 'WAITING') {
                // 방에 참여 중인지 확인하기 위해 서버에 체크 요청 (간단히 API 하나 추가하거나 현재 로직 활용)
                try {
                    const response = await fetch(`/battle/room/${roomId}/check-participant`);
                    const data = await response.json();
                    
                    if (data.isParticipant) {
                        if (confirm("이미 진행 중인 대결이 있습니다. 재접속하시겠습니까?")) {
                            location.href = `/battle/room/join/${roomId}`;
                            return;
                        } else {
                            // 명시적 거절 시 퇴장 처리
                            if (confirm("대결을 포기하고 퇴장하시겠습니까?")) {
                                await fetch(`/battle/room/${roomId}/leave-forced`, { method: 'POST' });
                                location.reload();
                            }
                            return;
                        }
                    } else {
                        alert("이미 시작된 방에는 입장할 수 없습니다.");
                        return;
                    }
                } catch (e) {
                    alert("방 상태 확인 중 오류가 발생했습니다.");
                    return;
                }
            }

            if (hasPassword) {
                const password = prompt("비밀번호를 입력하세요:");
                if (password) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/battle/room/join/verify';
                    const rInput = document.createElement('input'); rInput.type = 'hidden'; rInput.name = 'roomId'; rInput.value = roomId;
                    const pInput = document.createElement('input'); pInput.type = 'hidden'; pInput.name = 'password'; pInput.value = password;
                    form.appendChild(rInput); form.appendChild(pInput);
                    document.body.appendChild(form); form.submit();
                }
            } else {
                location.href = "/battle/room/join/" + roomId;
            }
        }

        // Search & Filter Logic
        const searchInput = document.getElementById('search-input');
        const enterableCheck = document.getElementById('enterable-only-check');

        function updateList() {
            const search = searchInput.value;
            const enterableOnly = enterableCheck.checked;
            location.href = `/battle/room/lobby?search=${encodeURIComponent(search)}&enterableOnly=${enterableOnly}`;
        }

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') updateList();
        });

        enterableCheck.addEventListener('change', updateList);

        // Quick Match Modal Logic
        const modal = document.getElementById('quick-match-modal');
        const modalBg = document.getElementById('modal-bg');
        const openBtn = document.getElementById('quick-match-btn');
        const modalCloseBtn = document.getElementById('close-modal-btn');

        openBtn.onclick = () => {
            modal.classList.replace('hidden', 'flex');
        };
        
        modalCloseBtn.onclick = () => {
        	modal.classList.replace('flex', 'hidden');
        };

        // Close on double click background
        let lastClick = 0;
        modalBg.onclick = () => {
            const now = Date.now();
            if (now - lastClick < 300) {
                modal.classList.replace('flex', 'hidden');
            }
            lastClick = now;
        };
    </script>
    <script th:replace="~{fragments/navbar :: navbarScript}"></script>
    <script type="module">
        import SSEManager from '/js/util/connection/sse-manager.js';
        SSEManager.init();
        
        lucide.createIcons();
    </script>
</body>
</html>
