<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{codingtest/editorCore :: head('Passfail - Many Solved', ~{::.extra-head})}">
    <th:block class="extra-head">
        <style>
            .battle-info-bar { height: 50px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; padding: 0 20px; gap: 20px; color: #f8fafc; font-size: 14px; font-weight: 800; }
            .mode-badge { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); color: white; padding: 4px 12px; border-radius: 9999px; font-size: 11px; }
            .prob-tab-container { display: flex; gap: 4px; }
            .prob-tab { padding: 6px 15px; background: #1e293b; border-radius: 8px 8px 0 0; font-size: 12px; cursor: pointer; color: #94a3b8; border: 1px solid #334155; border-bottom: none; }
            .prob-tab.active { background: #334155; color: #22c55e; border-color: #22c55e; font-weight: 900; }
            .prob-tab.solved { color: #22c55e; }
            .score-item { padding: 2px 10px; border-radius: 20px; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.3); font-size: 11px; color: #a78bfa; }
        </style>
    </th:block>
</head>
<body>
    <div id="problem-data" style="display:none;" 
         th:attr="data-desc=${problem.description}, data-id=${problem.problemId}, data-code=${defaultCode}, 
                  data-room-id=${roomId}, data-user-id=${currentUserId}">
    </div>
    <div th:replace="~{codingtest/editorCore :: topNav}"></div>

    <div class="battle-info-bar">
        <span class="mode-badge">많이 풀기 (MANY)</span>
        <div class="prob-tab-container ml-6">
            <div class="prob-tab active">문제 1</div>
            <div class="prob-tab">문제 2</div>
            <div class="prob-tab">문제 3</div>
        </div>
        <div id="battle-hud" class="flex items-center gap-3 ml-auto">
            <!-- 유저별 해결 문제 수 -->
        </div>
        <div style="margin-left:20px; display:flex; align-items:center; gap:15px;">
            <div class="text-rose-500 font-black" id="timer-display">29:59</div>
        </div>
    </div>

    <div class="main-container">
        <div th:replace="~{codingtest/editorCore :: problemPanel}"></div>
        <div class="right-panel">
            <div id="editor-container"></div>
            <div th:replace="~{codingtest/editorCore :: bottomPanel}"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="/battle/room/lobby" class="btn-pg btn-outline">포기</a>
        <button class="btn-pg btn-outline" onclick="EditorCore.runCode()">코드 실행</button>
        <button class="btn-pg btn-blue" onclick="EditorCore.submitCode()">정답 제출</button>
    </div>

    <div th:replace="~{codingtest/editorCore :: scripts}"></div>

    <script type="module">
        import WSManager from '/js/util/connection/websocket-manager.js';
        const roomId = [[${roomId}]];
        const currentUserId = [[${currentUserId}]];
        let solvedCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            EditorCore.init({
                onSubmitComplete: (data) => {
                    if (data.allCorrect) {
                        solvedCount++;
                        WSManager.sendProgress(roomId, currentUserId, `${solvedCount}:SOLVING`);
                        alert(`축하합니다! ${solvedCount}번째 문제를 해결하셨습니다.`);
                        // 다음 문제 로드 로직 필요
                    }
                }
            });
            initHUD();
            WSManager.connect(roomId, currentUserId);
            WSManager.sendConfirm(roomId, currentUserId);
        });

        window.updateBattleHUD = (memberId, data) => {
            const [count, status] = data.split(':');
            const scoreEl = document.getElementById(`score-${memberId}`);
            if (scoreEl) scoreEl.innerText = `${count} Solved`;
        };

        async function initHUD() {
            const res = await fetch(`/battle/room/${roomId}/positions`);
            const users = await res.json();
            const hud = document.getElementById('battle-hud');
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'score-item';
                div.innerHTML = `<span class="font-bold mr-2">${user.username}</span><span id="score-${user.memberId}">0 Solved</span>`;
                hud.appendChild(div);
            });
        }
    </script>
</body>
</html>
