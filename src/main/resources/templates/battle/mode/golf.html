<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{codingtest/editorCore :: head('Passfail - Code Golf', ~{::.extra-head})}">
    <th:block class="extra-head">
        <style>
            .battle-info-bar { height: 50px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; padding: 0 20px; gap: 20px; color: #f8fafc; font-size: 14px; font-weight: 800; }
            .mode-badge { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: white; padding: 4px 12px; border-radius: 9999px; font-size: 11px; }
            .hud-item { display: flex; flex-direction: column; width: 110px; gap: 2px; padding: 4px 8px; background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.3); border-radius: 6px; }
            .hud-name { font-size: 10px; color: #f8fafc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .hud-bytes { font-size: 12px; color: #fbbf24; font-family: monospace; font-weight: 900; }
            .winner-glow { border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
        </style>
    </th:block>
</head>
<body>
    <div id="problem-data" style="display:none;" 
         th:attr="data-desc=${problem.description}, data-id=${problem.problemId}, data-code=${defaultCode}, 
                  data-room-id=${roomId}, data-user-id=${currentUserId}">
    </div>
    <div th:replace="~{codingtest/editorCore :: topNav}"></div>

    <div class="battle-info-bar">
        <span class="mode-badge">코드 골프 (GOLF)</span>
        <div id="battle-hud" class="flex items-center gap-3 ml-10">
            <!-- 실시간 바이트 랭킹이 여기에 표시됨 -->
        </div>
        <div style="margin-left:auto; display:flex; align-items:center; gap:15px;">
            <div class="text-rose-500 font-black" id="timer-display">29:59</div>
        </div>
    </div>

    <div class="main-container">
        <div th:replace="~{codingtest/editorCore :: problemPanel}"></div>
        <div class="right-panel">
            <div id="editor-container"></div>
            <div th:replace="~{codingtest/editorCore :: bottomPanel}"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="/battle/room/lobby" class="btn-pg btn-outline">포기</a>
        <button class="btn-pg btn-outline" onclick="EditorCore.runCode()">코드 실행</button>
        <button class="btn-pg btn-blue" onclick="submitGolfCode()">최종 제출</button>
    </div>

    <div th:replace="~{codingtest/editorCore :: scripts}"></div>

    <script type="module">
        import WSManager from '/js/util/connection/websocket-manager.js';
        const roomId = [[${roomId}]];
        const currentUserId = [[${currentUserId}]];
        let lastSendTime = 0;

        document.addEventListener('DOMContentLoaded', () => {
            EditorCore.init({
                onEditorLoaded: (editor) => {
                    editor.onDidChangeModelContent(() => {
                        const now = Date.now();
                        if (now - lastSendTime > 1000) {
                            const bytes = new Blob([editor.getValue()]).size;
                            WSManager.sendProgress(roomId, currentUserId, `${bytes}:CODING`);
                            lastSendTime = now;
                        }
                    });
                }
            });
            initHUD();
            WSManager.connect(roomId, currentUserId);
            WSManager.sendConfirm(roomId, currentUserId);
        });

        window.updateBattleHUD = (memberId, data) => {
            const [bytes, status] = data.split(':');
            let item = document.getElementById(`hud-item-${memberId}`);
            if (item) {
                const byteEl = item.querySelector('.hud-bytes');
                byteEl.innerText = `${bytes} B`;
                if (status === 'FINISHED') item.classList.add('winner-glow');
            }
        };

        async function initHUD() {
            const res = await fetch(`/battle/room/${roomId}/positions`);
            const users = await res.json();
            const hud = document.getElementById('battle-hud');
            users.forEach(user => {
                const div = document.createElement('div');
                div.id = `hud-item-${user.memberId}`;
                div.className = 'hud-item';
                div.innerHTML = `
                    <div class="hud-name">${user.username}</div>
                    <div class="hud-bytes">0 B</div>
                `;
                hud.appendChild(div);
            });
        }

        window.submitGolfCode = function() {
            const bytes = new Blob([EditorCore.editor.getValue()]).size;
            EditorCore.submitCode((data) => {
                if (data.allCorrect) {
                    WSManager.sendProgress(roomId, currentUserId, `${bytes}:FINISHED`);
                    alert(`정답입니다! 기록: ${bytes} Bytes`);
                }
            });
        }
    </script>
</body>
</html>
