<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{codingtest/editorCore :: head('Passfail - Logic Maze', ~{::.extra-head})}">
    <th:block class="extra-head">
        <th:block th:replace="~{fragments/battleLibs :: libs}"></th:block>
        <link rel="stylesheet" th:href="@{/css/battle/logicMaze.css}">
    </th:block>
</head>
<body>
    <div id="problem-data" style="display:none;" 
         th:attr="data-desc=${problem.description}, data-id=${problem.problemId}, data-code=${defaultCode}, 
                  data-time=${problem.timeLimitMs}, data-mem=${problem.memoryLimitMb}, data-tc-count=${#lists.size(problem.testCases)},
                  data-is-logged-in=${#authorization.expression('isAuthenticated()')},
                  data-room-id=${roomId}, data-mode=${battleMode}, data-user-id=${currentUserId}">
    </div>

    <div th:replace="~{codingtest/editorCore :: topNav}"></div>

    <div class="battle-info-bar">
        <span class="mode-badge">로직 메이즈 (LOGIC MAZE)</span>
    </div>

    <div class="main-container">
        <div id="maze-container">
            <!-- Sidebar: API Guide & Legend -->
            <div id="maze-sidebar">
                <div class="api-section-title">Robot API</div>
                <div class="api-card"><b>robot.moveForward()</b>1칸 전진</div>
                <div class="api-card"><b>robot.turnLeft()</b>좌회전</div>
                <div class="api-card"><b>robot.turnRight()</b>우회전</div>
                <div class="api-card"><b>robot.useSwitch()</b>스위치 조작</div>
                <div class="api-card"><b>robot.say(msg)</b>로그 남기기</div>
                
                <div class="api-section-title mt-4">Legend</div>
                <div class="legend-item"><div class="legend-box" style="background: #3b82f6; border: 1px solid white;"></div><span>나의 로봇</span></div>
                <div class="legend-item"><div class="legend-box" style="background: rgba(148, 163, 184, 0.5);"></div><span>상대 로봇</span></div>
                <div class="legend-item"><div class="legend-box" style="background: #f59e0b;"></div><span>스위치 (Switch)</span></div>
                <div class="legend-item"><div class="legend-box" style="background: #ef4444;"></div><span>잠긴 문 (Door)</span></div>
                <div class="legend-item"><div class="legend-box" style="background: #10b981;"></div><span>출구 (Exit)</span></div>
            </div>

            <!-- Main Maze View -->
            <div id="maze-view">
                <canvas id="maze-canvas"></canvas>
                <div id="speech-bubble-container" style="position:absolute; inset:0; pointer-events:none;"></div>
                <div id="debug-console">
                    <div class="log-entry system">[SYSTEM] 디버그 콘솔이 활성화되었습니다. robot.say() 로 로그를 남기세요.</div>
                </div>
            </div>
        </div>
        <div class="right-panel">
            <div id="editor-container"></div>
            <div th:replace="~{codingtest/editorCore :: bottomPanel}"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <a id="exit-battle-btn" href="/battle/room/lobby" class="btn-pg btn-outline">포기</a>
        <button id="stopBtn" class="btn-pg btn-outline" style="display:none; color:#f43f5e; border-color:#f43f5e;">중단 (STOP)</button>
        <button id="runBtn" class="btn-pg btn-blue">로직 실행 (RUN)</button>
    </div>

    <div th:replace="~{codingtest/editorCore :: scripts}"></div>
    
    <script type="module" th:inline="javascript">
        import { LogicMazeController } from '/js/battle/logicMaze.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const roomId = [[${roomId}]];
            const currentUserId = [[${currentUserId}]];
            const seed = [[${seed}]];
            const problemId = [[${problem.problemId}]];
            const difficulty = [[${room.difficulty}]];
            
            LogicMazeController.init(roomId, currentUserId, seed, problemId, difficulty);
        });
    </script>
</body>
</html>
