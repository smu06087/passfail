<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{codingtest/editorCore :: head('Passfail - Quick Mode', ~{::.extra-head})}">
    <th:block class="extra-head">
        <style>
            .battle-info-bar { height: 50px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; padding: 0 20px; gap: 20px; color: #f8fafc; font-size: 14px; font-weight: 800; }
            .mode-badge { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white; padding: 4px 12px; border-radius: 9999px; font-size: 11px; }
        </style>
    </th:block>
</head>
<body>
    <div id="problem-data" style="display:none;" 
         th:attr="data-desc=${problem.description}, data-id=${problem.problemId}, data-code=${defaultCode}, 
                  data-time=${problem.timeLimitMs}, data-mem=${problem.memoryLimitMb}, data-tc-count=${#lists.size(problem.testCases)},
                  data-is-logged-in=${#authorization.expression('isAuthenticated()')},
                  data-room-id=${roomId}, data-mode=${battleMode}, data-user-id=${currentUserId}">
    </div>

    <div th:replace="~{codingtest/editorCore :: topNav}"></div>

    <div class="battle-info-bar">
        <span class="mode-badge">빨리 풀기 (QUICK)</span>
        
        <!-- 실시간 참여자 HUD -->
        <div id="battle-hud" class="flex items-center gap-6 ml-10">
            <!-- 유저별 진행도 아이템이 여기에 동적 생성됨 -->
        </div>

        <div style="margin-left:auto; display:flex; align-items:center; gap:15px;">
            <div class="text-rose-500 font-black" id="timer-display">29:59</div>
        </div>
    </div>

    <style>
        .hud-item { display: flex; flex-direction: column; width: 120px; gap: 4px; padding: 6px 10px; background: rgba(30, 41, 59, 0.5); border-radius: 8px; border: 1px solid #334155; }
        .hud-name { font-size: 11px; color: #f8fafc; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hud-metric { font-size: 10px; color: #fbbf24; font-family: monospace; display: flex; justify-content: space-between; }
        .hud-status-dot { width: 6px; height: 6px; border-radius: 50%; background: #475569; transition: background 0.3s; }
        .hud-status-dot.active { background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse-green 1s infinite; }
        
        @keyframes pulse-green { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>

    <div class="main-container">
        <div th:replace="~{codingtest/editorCore :: problemPanel}"></div>
        <div class="right-panel">
            <div id="editor-container"></div>
            <div th:replace="~{codingtest/editorCore :: bottomPanel}"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="/battle/room/lobby" class="btn-pg btn-outline">포기</a>
        <button class="btn-pg btn-outline" onclick="EditorCore.runCode()">실행</button>
        <button class="btn-pg btn-blue" onclick="EditorCore.submitCode()">제출</button>
    </div>

    <div th:replace="~{codingtest/editorCore :: scripts}"></div>
    <script type="module">
        import WSManager from '/js/util/connection/websocket-manager.js';
        
        const roomId = [[${roomId}]];
        const currentUserId = [[${currentUserId}]];
        let lastSendTime = 0;

        document.addEventListener('DOMContentLoaded', () => {
            EditorCore.init({
                onEditorLoaded: (editor) => {
                    editor.onDidChangeModelContent(() => {
                        const now = Date.now();
                        if (now - lastSendTime > 1500) { // 1.5초 간격으로 스로틀링
                            const lineCount = editor.getModel().getLineCount();
                            WSManager.sendProgress(roomId, currentUserId, `${lineCount}:ACTIVE`);
                            lastSendTime = now;
                        }
                    });
                },
                onSubmitComplete: (data) => {
                    if (data.allCorrect) {
                        WSManager.sendProgress(roomId, currentUserId, `SUCCESS:FINISHED`);
                    }
                }
            });

            initHUD();

            if (roomId && currentUserId) {
                WSManager.connect(roomId, currentUserId);
                WSManager.sendConfirm(roomId, currentUserId);
            }
        });

        function initHUD() {
            const hud = document.getElementById('battle-hud');
            fetch(`/battle/room/${roomId}/positions`).then(res => res.json()).then(users => {
                users.forEach(user => createHudItem(user.memberId, user.username));
            });

            window.updateBattleHUD = (memberId, data) => {
                const [metric, status] = data.split(':');
                const lineEl = document.getElementById(`hud-lines-${memberId}`);
                const dot = document.getElementById(`hud-dot-${memberId}`);
                const statusText = document.getElementById(`hud-status-${memberId}`);

                if (lineEl && metric !== 'SUCCESS') lineEl.innerText = `${metric} Lines`;
                
                if (dot) {
                    dot.classList.add('active');
                    // 3초 후 활동 표시등 끄기 (Typing 멈춤 감지)
                    clearTimeout(dot.timeout);
                    dot.timeout = setTimeout(() => dot.classList.remove('active'), 3000);
                }

                if (status === 'FINISHED') {
                    if (statusText) statusText.innerText = '★ WINNER';
                    if (statusText) statusText.style.color = '#22c55e';
                }
            };
        }

        function createHudItem(memberId, username) {
            const hud = document.getElementById('battle-hud');
            if (document.getElementById(`hud-item-${memberId}`)) return;

            const div = document.createElement('div');
            div.id = `hud-item-${memberId}`;
            div.className = 'hud-item';
            div.innerHTML = `
                <div class="hud-name">${username}</div>
                <div class="hud-metric">
                    <span id="hud-lines-${memberId}">0 Lines</span>
                    <div id="hud-dot-${memberId}" class="hud-status-dot"></div>
                </div>
                <div id="hud-status-${memberId}" class="hud-status" style="font-size:8px; color:#475569;">CODING</div>
            `;
            hud.appendChild(div);
        }
    </script>
</body>
</html>
