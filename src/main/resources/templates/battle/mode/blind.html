<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{codingtest/editorCore :: head('Passfail - Blind Coding', ~{::.extra-head})}">
    <th:block class="extra-head">
        <style>
            .battle-info-bar { height: 50px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; padding: 0 20px; gap: 20px; color: #f8fafc; font-size: 14px; font-weight: 800; }
            .mode-badge { background: linear-gradient(135deg, #64748b 0%, #1e293b 100%); color: white; padding: 4px 12px; border-radius: 9999px; font-size: 11px; }
            .blind-status { font-size: 11px; padding: 4px 12px; border-radius: 6px; background: #334155; color: #94a3b8; }
            .blind-status.submitted { background: #059669; color: white; animation: bounce 0.5s ease; }
            @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
            .blind-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        </style>
    </th:block>
</head>
<body>
    <div id="blind-modal" class="blind-overlay">
        <i data-lucide="eye-off" size="64" class="text-slate-500 mb-6"></i>
        <h1 class="text-3xl font-black text-white mb-2">블라인드 코딩 모드</h1>
        <p class="text-slate-400 text-center max-w-md mb-8">
            이 모드에서는 '코드 실행'이 불가능합니다.<br>
            오직 단 한 번의 제출로 모든 테스트 케이스를 통과해야 합니다.<br>
            자신의 논리를 믿으세요.
        </p>
        <button class="px-8 py-3 bg-blue-600 text-white rounded-2xl font-black shadow-xl hover:bg-blue-500 transition-all" onclick="startBlind()">시작하기</button>
    </div>

    <div id="problem-data" style="display:none;" 
         th:attr="data-desc=${problem.description}, data-id=${problem.problemId}, data-code=${defaultCode}, 
                  data-room-id=${roomId}, data-user-id=${currentUserId}">
    </div>
    <div th:replace="~{codingtest/editorCore :: topNav}"></div>

    <div class="battle-info-bar">
        <span class="mode-badge">블라인드 (BLIND)</span>
        <div id="battle-hud" class="flex items-center gap-3 ml-10">
            <!-- 제출 여부가 실시간으로 표시됨 -->
        </div>
        <div style="margin-left:auto; display:flex; align-items:center; gap:15px;">
            <div class="text-rose-500 font-black" id="timer-display">29:59</div>
        </div>
    </div>

    <div class="main-container">
        <div th:replace="~{codingtest/editorCore :: problemPanel}"></div>
        <div class="right-panel">
            <div id="editor-container"></div>
            <div th:replace="~{codingtest/editorCore :: bottomPanel}"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="/battle/room/lobby" class="btn-pg btn-outline">포기</a>
        <!-- 실행 버튼 의도적으로 제거됨 -->
        <button class="btn-pg btn-blue" onclick="submitBlindCode()">단 한 번의 제출</button>
    </div>

    <div th:replace="~{codingtest/editorCore :: scripts}"></div>

    <script type="module">
        import WSManager from '/js/util/connection/websocket-manager.js';
        const roomId = [[${roomId}]];
        const currentUserId = [[${currentUserId}]];

        window.startBlind = function() {
            document.getElementById('blind-modal').style.display = 'none';
            EditorCore.init();
            initHUD();
            WSManager.connect(roomId, currentUserId);
            WSManager.sendConfirm(roomId, currentUserId);
            lucide.createIcons();
        }

        window.updateBattleHUD = (memberId, data) => {
            const [val, status] = data.split(':');
            const statusEl = document.getElementById(`status-${memberId}`);
            if (status === 'SUBMITTED' && statusEl) {
                statusEl.classList.add('submitted');
                statusEl.innerText = 'SUBMITTED';
            }
        };

        async function initHUD() {
            const res = await fetch(`/battle/room/${roomId}/positions`);
            const users = await res.json();
            const hud = document.getElementById('battle-hud');
            users.forEach(user => {
                const div = document.createElement('div');
                div.id = `status-${user.memberId}`;
                div.className = 'blind-status';
                div.innerText = `${user.username}: WAITING`;
                hud.appendChild(div);
            });
        }

        window.submitBlindCode = function() {
            if (!confirm("정말 제출하시겠습니까? 블라인드 모드에서는 재제출이 불가능합니다.")) return;
            
            EditorCore.submitCode((data) => {
                WSManager.sendProgress(roomId, currentUserId, `DONE:SUBMITTED`);
                if (data.allCorrect) {
                    alert("🎉 완벽합니다! 정답입니다!");
                } else {
                    alert("❌ 아쉽게도 틀렸습니다. 블라인드 모드는 한 번만 제출 가능합니다.");
                }
                location.href = '/battle/room/lobby';
            });
        }
    </script>
</body>
</html>
