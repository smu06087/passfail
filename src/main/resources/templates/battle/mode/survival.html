<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{codingtest/editorCore :: head('Passfail - Survival Mode', ~{::.extra-head})}">
    <th:block class="extra-head">
        <style>
            .battle-info-bar { height: 50px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; padding: 0 20px; gap: 20px; color: #f8fafc; font-size: 14px; font-weight: 800; }
            .mode-badge { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); color: white; padding: 4px 12px; border-radius: 9999px; font-size: 11px; }
            .survivor-item { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: #1e293b; border-radius: 6px; border: 1px solid #334155; }
            .survivor-item.eliminated { opacity: 0.3; filter: grayscale(1); border-color: #f43f5e; }
            .survivor-name { font-size: 11px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .skull-icon { color: #f43f5e; display: none; }
            .eliminated .skull-icon { display: block; }
            .elimination-timer { color: #f43f5e; font-family: monospace; font-size: 16px; animation: blink 1s infinite; }
            @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        </style>
    </th:block>
</head>
<body>
    <div id="problem-data" style="display:none;" 
         th:attr="data-desc=${problem.description}, data-id=${problem.problemId}, data-code=${defaultCode}, 
                  data-room-id=${roomId}, data-user-id=${currentUserId}">
    </div>
    <div th:replace="~{codingtest/editorCore :: topNav}"></div>

    <div class="battle-info-bar">
        <span class="mode-badge">서바이벌 (SURVIVAL)</span>
        <div id="battle-hud" class="flex items-center gap-3 ml-10">
            <!-- 생존자 리스트 -->
        </div>
        <div style="margin-left:auto; display:flex; align-items:center; gap:20px;">
            <div class="flex flex-col items-end">
                <span class="text-[9px] text-slate-500 uppercase">Next Elimination</span>
                <span id="elimination-clock" class="elimination-timer">05:00</span>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div th:replace="~{codingtest/editorCore :: problemPanel}"></div>
        <div class="right-panel">
            <div id="editor-container"></div>
            <div th:replace="~{codingtest/editorCore :: bottomPanel}"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="/battle/room/lobby" class="btn-pg btn-outline">포기</a>
        <button class="btn-pg btn-outline" onclick="EditorCore.runCode()">코드 실행</button>
        <button class="btn-pg btn-blue" onclick="EditorCore.submitCode()">제출</button>
    </div>

    <div th:replace="~{codingtest/editorCore :: scripts}"></div>

    <script type="module">
        import WSManager from '/js/util/connection/websocket-manager.js';
        const roomId = [[${roomId}]];
        const currentUserId = [[${currentUserId}]];
        let eliminationInterval = 300; // 5분

        document.addEventListener('DOMContentLoaded', () => {
            EditorCore.init();
            initHUD();
            WSManager.connect(roomId, currentUserId);
            WSManager.sendConfirm(roomId, currentUserId);
            startEliminationTimer();
        });

        window.updateBattleHUD = (memberId, data) => {
            if (data === 'ELIMINATED') {
                const item = document.getElementById(`survivor-${memberId}`);
                if (item) item.classList.add('eliminated');
                if (memberId == currentUserId) {
                    alert("💀 당신은 탈락했습니다! 관전 모드로 전환됩니다.");
                    document.getElementById('editor-container').style.pointerEvents = 'none';
                    document.getElementById('editor-container').style.opacity = '0.5';
                }
            }
        };

        async function initHUD() {
            const res = await fetch(`/battle/room/${roomId}/positions`);
            const users = await res.json();
            const hud = document.getElementById('battle-hud');
            users.forEach(user => {
                const div = document.createElement('div');
                div.id = `survivor-${user.memberId}`;
                div.className = 'survivor-item';
                div.innerHTML = `
                    <i data-lucide="skull" size="12" class="skull-icon"></i>
                    <span class="survivor-name">${user.username}</span>
                `;
                hud.appendChild(div);
            });
            lucide.createIcons();
        }

        function startEliminationTimer() {
            const clock = document.getElementById('elimination-clock');
            setInterval(() => {
                eliminationInterval--;
                if (eliminationInterval < 0) eliminationInterval = 300; // 리셋
                const m = Math.floor(eliminationInterval / 60);
                const s = eliminationInterval % 60;
                clock.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }
    </script>
</body>
</html>
