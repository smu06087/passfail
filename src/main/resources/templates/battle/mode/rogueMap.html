<style>
#game-layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin: 20px auto;
    max-width: 1300px;
}

#side-panel-left, #side-panel-right {
    width: 300px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px;
    color: white;
    font-family: "Pretendard", sans-serif;
    min-height: 500px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

#map-container {
    position: relative;
    width: 600px;
    height: 800px;
    background: radial-gradient(circle, #1e293b, #020617);
    overflow: hidden; 
    border: 3px solid #475569;
    border-radius: 12px;
    cursor: grab;
    user-select: none;
}

/* 플레이어 리스트 스타일 */
.info-title { 
    font-size: 20px; font-weight: 800; border-bottom: 2px solid #f1c40f; 
    padding-bottom: 10px; margin-bottom: 20px; color: #f8fafc;
    display: flex; justify-content: space-between; align-items: center;
}
.player-list-scroll { max-height: 600px; overflow-y: auto; }
.player-item {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    background: rgba(255,255,255,0.05); border-radius: 8px;
    margin-bottom: 10px; border: 1px solid transparent; transition: 0.2s;
}
.player-item.is-me { border-color: #f1c40f; background: rgba(241, 196, 15, 0.1); }
.player-rank-circle {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 13px; color: white; border: 2px solid rgba(255,255,255,0.2);
}
.player-info-text { flex: 1; }
.player-name { font-weight: 700; font-size: 15px; color: #f1f5f9; }
.player-status { font-size: 12px; color: #94a3b8; }
.player-points { font-weight: 900; color: #fbbf24; font-size: 16px; text-align: right; }

/* 우측 패널 스타일 */
.timer-box { 
    text-align: center; font-size: 48px; font-weight: 900; color: #ef4444; 
    margin-bottom: 30px; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
}
.info-section { margin-bottom: 25px; }
.info-label { font-size: 13px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.info-value { font-size: 18px; font-weight: 700; color: #f1f5f9; margin-top: 4px; }
.my-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; background: #f1c40f; color: #000; margin-left: 5px; vertical-align: middle; }

#map-container:active { cursor: grabbing; }
#map-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
#nodes-layer { position: absolute; top: 0; left: 0; z-index: 2; width: 100%; height: 1300px; }

.node {
    position: absolute; width: 50px; height: 50px;
    background: #334155; border: 2px solid #64748b;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; color: #f1f5f9; font-size: 12px;
    cursor: not-allowed; transition: 0.3s; transform: translate(-50%, -50%);
}
.node.active { background: #ea580c; border-color: #fbbf24; cursor: pointer; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
.node.cleared { background: #16a34a; border-color: #22c55e; }
.node.current { border: 4px solid #fff; box-shadow: 0 0 25px #fff; z-index: 3; }
.node.boss { width: 80px; height: 80px; background: #991b1b; font-weight: 900; font-size: 20px; border-color: #ef4444; }
.node.event { background: #7c3aed; border-color: #a78bfa; }

.player-marker {
    position: absolute; width: 32px; height: 32px;
    background: #2563eb; border: 2px solid #fff;
    border-radius: 50%; z-index: 5; pointer-events: none;
    transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 11px; font-weight: 900;
}
.player-marker.cleared { background: #059669; box-shadow: 0 0 20px rgba(5, 150, 105, 0.7); animation: pulse-green 2s infinite; }
.player-marker.boss-cleared { background: #d97706; border-color: #fff; box-shadow: 0 0 30px rgba(217, 119, 6, 0.8); width: 42px; height: 42px; font-size: 18px; z-index: 10; }

@keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.7); }
    70% { box-shadow: 0 0 0 12px rgba(5, 150, 105, 0); }
    100% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0); }
}

@keyframes bounce {
    0%, 100% { transform: translate(-50%, -100%); }
    50% { transform: translate(-50%, -135%); }
}
.guide-arrow { position: absolute; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: center; animation: bounce 1.2s infinite ease-in-out; }
.guide-text { background: #fbbf24; color: #000; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 900; margin-bottom: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
.guide-icon { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 14px solid #fbbf24; }
</style>

<div id="game-layout">
    <!-- 좌측 패널: 플레이어 리스트 -->
    <div id="side-panel-left">
        <div class="info-title">참가자 현황 <span style="font-size: 12px; color: #94a3b8; font-weight: 400;">BATTLE</span></div>
        <div id="player-list-container" class="player-list-scroll">
            <!-- JS에서 동적 생성 -->
        </div>
    </div>

    <!-- 중앙: 맵 -->
    <div id="map-container">
        <canvas id="map-canvas"></canvas>
        <div id="nodes-layer"></div>
        <div id="victory-layer" style="position:absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100;"></div>
    </div>

    <!-- 우측 패널: 글로벌 정보 -->
    <div id="side-panel-right">
        <div class="info-title">배틀 리포트</div>
        
        <div class="info-section">
            <div class="info-label">경과 시간</div>
            <div id="battle-timer" class="timer-box">00:00</div>
        </div>

        <div class="info-section">
            <div class="info-label">현재 내 위치</div>
            <div id="my-location-text" class="info-value">로딩 중...</div>
        </div>

        <div class="info-section">
            <div class="info-label">나의 실시간 포인트</div>
            <div id="my-points-text" class="info-value" style="color: #fbbf24; font-size: 24px;">0 PTS</div>
        </div>
        
        <div style="margin-top: 80px; font-size: 12px; color: #64748b; border-top: 1px solid #334155; padding-top: 15px; line-height: 1.6;">
            <div style="margin-bottom: 8px;"><strong style="color: #94a3b8;">[포인트 산정 기준]</strong></div>
            • 일반 노드 클리어: 100 + (층*10) pts<br>
            • 보스 노드 클리어: 300 pts<br>
            • 모든 참가자 이탈 시 방이 자동 종료됩니다.
        </div>
    </div>
</div>

<script th:inline="javascript">
const nodesLayer = document.getElementById('nodes-layer');
const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');

canvas.width = 600;
canvas.height = 1300; 

const serverSeed = Number('[[${mapSeed}]]'); 
const roomId = [[${roomId}]];
const memberId = [[${currentUserId}]];

let mapData = [];
let activeNodeIds = []; 

// DB에서 불러올 데이터들
let visitedNodes = [];
let visitedPaths = []; 
let currentNodeId = null;
let cumulativeScore = 0;

let playerPositions = {}; // { memberId: { nodeId, isCleared, slotIndex, username, score, visitedNodes, visitedPaths } }

let battleStartTime = [[${battleStartTime}]] || Date.now(); 

function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

window.onload = async () => {
    console.log("서버로부터 받은 시드:", serverSeed);
    const random = mulberry32(serverSeed);
    generateMap(random); 
    
    // 1. 초기 데이터 동기화 (DB에서 진행도 로드)
    await syncProgressWithDB();
    
    // 2. 결과 처리 (도전 성공 또는 포기)
    const urlParams = new URLSearchParams(window.location.search);
    const cleared = urlParams.get('cleared');
    const nodeId = urlParams.get('nodeId');
    
    if (nodeId) {
        if (cleared === 'true') {
            if (!visitedNodes.includes(nodeId)) {
                const scoreGain = calculatePoints(nodeId, true);
                processClear(nodeId);
                cumulativeScore += scoreGain;
                await saveProgressToDB(nodeId, true, scoreGain);
            }
        } else if (cleared === 'false') {
            // 포기하고 돌아온 경우: DB에 해당 노드 미완료 상태로 갱신 (CurrentNodeId는 유지하되 isFinished=false)
            await saveProgressToDB(nodeId, false, 0);
        }
    }
    
    // 3. 타 플레이어 위치 불러오기
    await fetchPlayerPositions();
    updateActiveNodes();
    drawMap();
    
    setInterval(updateTimer, 1000);

    const container = document.getElementById('map-container');
    if (currentNodeId) {
        const node = mapData.flat().find(n => n.id === currentNodeId);
        if (node) container.scrollTop = node.y - 400;
    } else {
        container.scrollTop = container.scrollHeight;
    }
};

async function syncProgressWithDB() {
    try {
        const res = await fetch(`/battle/room/${roomId}/positions`);
        const data = await res.json();
        const myInfo = data.find(p => p.memberId == memberId);
        
        if (myInfo) {
            currentNodeId = myInfo.nodeId || null;
            cumulativeScore = myInfo.score || 0;
            // DB에서 방문 노드 및 경로 복구
            visitedNodes = JSON.parse(myInfo.visitedNodes || '[]');
            visitedPaths = JSON.parse(myInfo.visitedPaths || '[]');
        }
    } catch (e) { console.error("진행도 동기화 실패:", e); }
}

async function saveProgressToDB(nodeId, isCleared, scoreGain) {
    try {
        await fetch(`/battle/room/${roomId}/rogue-update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nodeId: nodeId,
                isCleared: isCleared,
                scoreGain: scoreGain,
                visitedNodes: JSON.stringify(visitedNodes),
                visitedPaths: JSON.stringify(visitedPaths)
            })
        });
    } catch (e) { console.error("DB 저장 실패:", e); }
}

function updateTimer() {
    const diff = Math.floor((Date.now() - battleStartTime) / 1000);
    const m = String(Math.floor(diff / 60)).padStart(2, '0');
    const s = String(diff % 60).padStart(2, '0');
    const el = document.getElementById('battle-timer');
    if (el) el.innerText = `${m}:${s}`;
}

async function fetchPlayerPositions() {
    try {
        const res = await fetch(`/battle/room/${roomId}/positions`);
        const data = await res.json();
        data.forEach(p => {
            if (p.nodeId) {
                playerPositions[p.memberId] = {
                    nodeId: p.nodeId,
                    isCleared: p.isCleared,
                    slotIndex: p.slotIndex,
                    username: p.username,
                    score: p.score,
                    visitedNodes: JSON.parse(p.visitedNodes || '[]'),
                    visitedPaths: JSON.parse(p.visitedPaths || '[]')
                };
            }
        });
    } catch (e) { console.error("위치 정보 로드 실패:", e); }
}

function calculatePoints(nodeId, isCleared) {
    if (!nodeId || !isCleared) return 0;
    const floor = parseInt(nodeId.split('-')[0]);
    const node = mapData.flat().find(n => n.id === nodeId);
    if (node && node.type === 'BOSS') return 300;
    return 100 + (floor * 10);
}

function updateUI() {
    const listContainer = document.getElementById('player-list-container');
    if (!listContainer) return;
    listContainer.innerHTML = '';

    const sortedPlayers = Object.values(playerPositions).sort((a, b) => a.slotIndex - b.slotIndex);

    sortedPlayers.forEach(p => {
        const floor = p.nodeId ? p.nodeId.split('-')[0] : "0";
        const points = p.score || 0;
        
        const item = document.createElement('div');
        item.className = `player-item ${p.memberId == memberId ? 'is-me' : ''}`;
        item.innerHTML = `
            <div class="player-rank-circle" style="background: ${getColorBySlot(p.slotIndex)}">${p.slotIndex + 1}P</div>
            <div class="player-info-text">
                <div class="player-name">${p.username} ${p.memberId == memberId ? '<span class="my-badge">MY</span>' : ''}</div>
                <div class="player-status">${floor}층 ${p.isCleared ? '클리어!' : '도전 중'}</div>
            </div>
            <div class="player-points">${points}</div>
        `;
        listContainer.appendChild(item);
    });

    const myInfo = playerPositions[memberId];
    if (myInfo) {
        document.getElementById('my-location-text').innerText = `${myInfo.nodeId.split('-')[0]}층 (${myInfo.isCleared ? '완료' : '도전 중'})`;
        document.getElementById('my-points-text').innerText = `${myInfo.score || 0} PTS`;
    } else {
        document.getElementById('my-location-text').innerText = '출발 대기 중';
    }
}

function getColorBySlot(idx) {
    const colors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#f97316'];
    return colors[idx % colors.length];
}

function processClear(nodeId) {
    if (!visitedNodes.includes(nodeId)) {
        // 경로(Line) 추가: 마지막으로 클리어한 노드에서 현재 노드로의 연결
        const lastClearedNodeId = visitedNodes.length > 0 ? visitedNodes[visitedNodes.length - 1] : null;
        
        if (lastClearedNodeId && lastClearedNodeId !== nodeId) {
            visitedPaths.push([lastClearedNodeId, nodeId]);
        }
        
        visitedNodes.push(nodeId);
        currentNodeId = nodeId;
    }
}

function updateActiveNodes() {
    if (visitedNodes.length === 0) {
        // 1. 배틀 시작 전: 0층 첫 노드 활성화
        activeNodeIds = [mapData[0][0].id];
    } else {
        const lastClearedNodeId = visitedNodes[visitedNodes.length - 1];
        
        // 2. 현재 위치(currentNodeId)가 아직 클리어되지 않았다면 (도전 중이거나 포기)
        if (currentNodeId && !visitedNodes.includes(currentNodeId)) {
            // "한 노드 되돌아가기" 기획: 마지막 클리어 노드에서 갈 수 있는 모든 선택지를 다시 노출
            const lastNode = mapData.flat().find(n => n.id === lastClearedNodeId);
            activeNodeIds = lastNode ? lastNode.connectedTo : [];
        } else {
            // 3. 현재 위치가 클리어된 상태라면 다음 노드들 활성화
            const node = mapData.flat().find(n => n.id === currentNodeId);
            if (node && node.type === 'BOSS') {
                activeNodeIds = []; // 보스 정복 시 종료
            } else {
                activeNodeIds = node ? node.connectedTo : [];
            }
        }
    }
}

function generateMap(random) {
    mapData = [];
    for (let f = 0; f < 10; f++) {
        let floor = [];
        let nodeCount = (f === 0 || f === 9) ? 1 : Math.floor(random() * 3) + 2;
        for (let n = 0; n < nodeCount; n++) {
            let type = (f === 9) ? "BOSS" : (random() > 0.15 ? "Puzzle" : "Event");
            let x = (600 / (nodeCount + 1)) * (n + 1);
            let y = 1200 - (f * 120); 
            floor.push({ id: `${f}-${n}`, type: type, x: x, y: y, connectedTo: [] });
        }
        mapData.push(floor);
    }
    for (let f = 0; f < mapData.length - 1; f++) {
        let currentFloor = mapData[f];
        let nextFloor = mapData[f + 1];
        for (let i = 0; i < currentFloor.length; i++) {
            let node = currentFloor[i];
            let targetIdx = Math.floor((i / currentFloor.length) * nextFloor.length);
            node.connectedTo.push(nextFloor[targetIdx].id);
            if (targetIdx + 1 < nextFloor.length && random() > 0.5) node.connectedTo.push(nextFloor[targetIdx + 1].id);
        }
        for (let ni = 0; ni < nextFloor.length; ni++) {
            let nextNode = nextFloor[ni];
            let hasParent = currentFloor.some(n => n.connectedTo.includes(nextNode.id));
            if (!hasParent) {
                let parentIdx = Math.floor((ni / nextFloor.length) * currentFloor.length);
                currentFloor[parentIdx].connectedTo.push(nextNode.id);
            }
        }
    }
}

function drawMap() {
    nodesLayer.innerHTML = '';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    mapData.forEach((floor, fIdx) => {
        floor.forEach(node => {
            node.connectedTo.forEach(targetId => {
                const targetFloor = mapData[fIdx + 1];
                const target = targetFloor.find(n => n.id === targetId);
                const isVisitedPath = visitedPaths.some(path => path[0] === node.id && path[1] === targetId);
                ctx.beginPath();
                ctx.moveTo(node.x, node.y);
                ctx.lineTo(target.x, target.y);
                if (isVisitedPath) { ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.setLineDash([]); }
                else { ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]); }
                ctx.stroke();
            });
        });
    });
    mapData.forEach((floor) => {
        floor.forEach(node => {
            const div = document.createElement('div');
            const isVisited = visitedNodes.includes(node.id);
            const isActive = activeNodeIds.includes(node.id);
            const isCurrent = (node.id === currentNodeId);
            div.className = `node ${node.type === 'BOSS' ? 'boss' : ''} ${node.type === 'Event' ? 'event' : ''}`;
            if (isVisited) div.classList.add('cleared');
            if (isActive) div.classList.add('active');
            if (isCurrent) div.classList.add('current');
            div.style.left = `${node.x}px`;
            div.style.top = `${node.y}px`;
            div.innerText = node.type === 'BOSS' ? 'B' : (node.type === 'Event' ? '?' : 'P');
            if (isActive && node.id === mapData[0][0].id && !currentNodeId) {
                const arrow = document.createElement('div');
                arrow.className = 'guide-arrow';
                arrow.style.left = `${node.x}px`; arrow.style.top = `${node.y}px`;
                arrow.innerHTML = `<div class="guide-text">START</div><div class="guide-icon"></div>`;
                nodesLayer.appendChild(arrow);
            }
            div.onclick = () => { if (isActive) handleNodeClick(node); };
            nodesLayer.appendChild(div);
        });
    });
    renderPlayerMarkers();
    updateUI();
}

function renderPlayerMarkers() {
    document.querySelectorAll('.player-marker').forEach(m => m.remove());
    document.getElementById('victory-layer').innerHTML = '';
    Object.entries(playerPositions).forEach(([pid, info]) => {
        const { nodeId, isCleared, slotIndex, visitedNodes: vNodes } = info;
        const node = mapData.flat().find(n => n.id === nodeId);
        if (node) {
            const marker = document.createElement('div');
            marker.className = 'player-marker';
            if (isCleared) marker.classList.add('cleared');
            if (node.type === 'BOSS' && isCleared) {
                marker.className = 'player-marker boss-cleared';
                marker.innerText = "👑";
                const winInfo = document.createElement('div');
                winInfo.style = "background: rgba(217, 119, 6, 0.9); color: white; padding: 8px 15px; border-radius: 8px; font-weight: 900; border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.3);";
                winInfo.innerText = `${slotIndex + 1}P FINISHED!`;
                document.getElementById('victory-layer').appendChild(winInfo);
            } else {
                marker.innerText = `${slotIndex + 1}P`;
            }
            marker.style.left = `${node.x}px`;
            marker.style.top = `${node.y - 38}px`; 
            nodesLayer.appendChild(marker);
        }
    });
}

async function handleNodeClick(node) {
    const action = node.type === 'Event' ? '이벤트에 참여' : '단계에 도전';
    if (confirm(`'${node.type}' ${action}하시겠습니까?`)) {
        const floor = node.id.split('-')[0];
        
        // 1. 입장 즉시 DB 갱신 (CurrentNodeId 설정, isFinished=false)
        await saveProgressToDB(node.id, false, 0);

        if (node.type === 'Event') {
            alert("신비한 기운이 당신을 감쌉니다! (포인트 획득)");
            processClear(node.id);
            // 이벤트는 즉시 클리어 처리
            await saveProgressToDB(node.id, true, calculatePoints(node.id, true));
            updateActiveNodes();
            drawMap();
        } else {
            location.href = `/codingtest/battle?roomId=${roomId}&floor=${floor}&nodeId=${node.id}&seed=${serverSeed}`;
        }
    }
}

const container = document.getElementById('map-container');
let isDown = false, startY, scrollTop;
container.addEventListener('mousedown', (e) => { isDown = true; startY = e.pageY - container.offsetTop; scrollTop = container.scrollTop; });
container.addEventListener('mouseleave', () => { isDown = false; });
container.addEventListener('mouseup', () => { isDown = false; });
container.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const y = e.pageY - container.offsetTop;
    const walk = (y - startY) * 1.5;
    container.scrollTop = scrollTop - walk;
});
container.addEventListener('touchstart', (e) => { isDown = true; startY = e.touches[0].pageY - container.offsetTop; scrollTop = container.scrollTop; });
container.addEventListener('touchmove', (e) => {
    if (!isDown) return;
    const y = e.touches[0].pageY - container.offsetTop;
    const walk = (y - startY) * 1.5;
    container.scrollTop = scrollTop - walk;
});
container.addEventListener('touchend', () => { isDown = false; });
</script>

<!-- 공통 배틀 라이브러리 (WebSocket 포함) -->
<th:block th:replace="~{fragments/battleLibs :: libs}"></th:block>

<script type="module">
    import WSManager from '/js/util/connection/websocket-manager.js';

    const roomId = [[${roomId}]];
    const memberId = [[${currentUserId}]];

    if (roomId && memberId) {
        WSManager.connect(roomId, memberId);
        WSManager.sendConfirm(roomId, memberId);
        window.sendMyPosition = (nodeId, isCleared) => {
            WSManager.sendPosition(roomId, memberId, `${nodeId}:${isCleared}`);
        };
        window.updatePlayerPosition = (pid, nid, slotIndex, isCleared) => {
            if (!playerPositions[pid]) playerPositions[pid] = { username: 'Unknown' };
            playerPositions[pid].nodeId = nid;
            playerPositions[pid].slotIndex = slotIndex;
            playerPositions[pid].isCleared = isCleared;
            drawMap();
        };
    }
</script>
