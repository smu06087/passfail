<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PassFail - 랭킹</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tier-badge { 
            font-weight: bold; 
            padding: 8px 15px; 
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .tier-BRONZE { background-color: #cd7f32; color: white; }
        .tier-SILVER { background-color: #c0c0c0; color: black; }
        .tier-GOLD { background-color: #ffd700; color: black; }
        .tier-PLATINUM { background-color: #e5e4e2; color: #007bff; }
        .tier-DIAMOND { background-color: #b9f2ff; color: #004085; }
        .tier-RUBY { background-color: #ff0000; color: white; }
        
        .rank-1 { background-color: #fff3cd; }
        .rank-2 { background-color: #e2e3e5; }
        .rank-3 { background-color: #d7ccc8; }
        
        table tbody tr { 
            transition: background-color 0.3s ease;
        }
        table tbody tr:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🏆 전체 랭킹 (Top 100)</h2>
        <button id="updateBtn" class="btn btn-outline-danger btn-sm">
            🔄 랭킹 갱신 (관리자전용)
        </button>
    </div>

    <!-- 로딩 상태 표시 -->
    <div id="loadingSpinner" class="text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p>랭킹 데이터를 불러오는 중...</p>
    </div>

    <!-- 에러 메시지 표시 -->
    <div id="errorAlert" class="alert alert-danger d-none" role="alert">
        <strong>오류 발생!</strong> <span id="errorMsg"></span>
    </div>

    <!-- 랭킹 테이블 -->
    <table class="table table-hover text-center">
        <thead class="table-dark">
            <tr>
                <th>순위</th>
                <th>사용자명</th>
                <th>티어</th>
                <th>총 점수</th>
            </tr>
        </thead>
        <tbody id="rankingBody">
            <!-- 데이터가 여기에 들어옵니다 -->
        </tbody>
    </table>
</div>

<script>
    // 페이지 로드 시 랭킹 데이터 가져오기
    document.addEventListener('DOMContentLoaded', () => {
        loadRankingData();
    });

    function loadRankingData() {
        const tbody = document.getElementById('rankingBody');
        const spinner = document.getElementById('loadingSpinner');
        const errorAlert = document.getElementById('errorAlert');

        spinner.style.display = 'block';
        errorAlert.classList.add('d-none');
        tbody.innerHTML = '';

        fetch('/ranking/top')
            .then(res => {
                if (!res.ok) throw new Error('서버 오류: ' + res.status);
                return res.json();
            })
            .then(data => {
                spinner.style.display = 'none';

                if (!data || data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-muted">
                                📊 아직 랭킹 데이터가 없습니다.
                                <br><small>관리자가 /ranking/init-batch를 실행해주세요.</small>
                            </td>
                        </tr>
                    `;
                    return;
                }

                data.forEach(user => {
                    let rowClass = '';
                    if (user.currentRank === 1) rowClass = 'rank-1';
                    else if (user.currentRank === 2) rowClass = 'rank-2';
                    else if (user.currentRank === 3) rowClass = 'rank-3';

                    const row = `
                        <tr class="${rowClass}">
                            <td><strong>#${user.currentRank}</strong></td>
                            <td><strong>${escapeHtml(user.username)}</strong></td>
                            <td>
                                <span class="tier-badge tier-${user.tier}">
                                    ${user.tier}
                                </span>
                            </td>
                            <td>${user.totalScore.toLocaleString()} 점</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            })
            .catch(err => {
                spinner.style.display = 'none';
                console.error('❌ 랭킹 로딩 실패:', err);
                
                document.getElementById('errorMsg').textContent = 
                    err.message || '데이터를 불러올 수 없습니다.';
                errorAlert.classList.remove('d-none');

                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-danger">
                            데이터 로드 실패. 잠시 후 다시 시도해주세요.
                        </td>
                    </tr>
                `;
            });
    }

    // 관리자용 업데이트 버튼
    document.getElementById('updateBtn').addEventListener('click', () => {
        if (!confirm('⚠️ 전체 사용자의 순위를 재계산하시겠습니까?')) return;

        document.getElementById('updateBtn').disabled = true;
        document.getElementById('updateBtn').innerHTML = '처리 중...';

        fetch('/ranking/update', { method: 'POST' })
            .then(res => {
                if (res.ok) {
                    alert('✅ 랭킹이 성공적으로 업데이트되었습니다.');
                    location.reload();
                } else {
                    alert('❌ 권한이 없거나 오류가 발생했습니다.');
                }
            })
            .catch(err => {
                alert('❌ 오류: ' + err.message);
            })
            .finally(() => {
                document.getElementById('updateBtn').disabled = false;
                document.getElementById('updateBtn').innerHTML = '🔄 랭킹 갱신 (관리자전용)';
            });
    });

    // XSS 방지
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
