<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - Passfail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/member/join.css}">
    <style>
        .wrap { width: 480px; margin: 40px auto; } /* Added margin for better look */
        .recovery-box { text-align: center; padding: 20px; }
        .recovery-box p { color: #666; margin-bottom: 20px; line-height: 1.6; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .verification-group { display: flex; gap: 10px; }
        .verification-group input { flex: 1; }
        .btn-small { padding: 10px 15px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .btn-recover { width: 100%; padding: 12px; background-color: #4A90E2; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn-recover:hover { background-color: #357ABD; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 10px; }
        #passwordSection { display: none; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1 onclick="location.href='/main'" style="cursor:pointer;">비밀번호 변경</h1>
        <div class="recovery-box">
            <p>안전을 위해 이메일 인증이 필요합니다.</p>
            
            <!-- 이메일 인증 섹션 -->
            <div id="emailSection">
                <div class="input-group">
                    <label>이메일</label>
                    <div class="verification-group">
                        <input type="email" id="email" th:value="${email}" readonly>
                        <button type="button" class="btn-small" onclick="sendCode()">코드 발송</button>
                    </div>
                </div>
                <div class="input-group" id="codeGroup" style="display:none; margin-top: 10px;">
                    <label>인증코드</label>
                    <div class="verification-group">
                        <input type="text" id="verificationCode" placeholder="6자리 코드 입력">
                        <button type="button" class="btn-small" onclick="verifyCode()">확인</button>
                    </div>
                </div>
            </div>

            <!-- 비밀번호 입력 섹션 (인증 후 노출) -->
            <form id="passwordSection" th:action="@{/mypage/change-password}" method="post">
                <div class="input-group">
                    <label>새 비밀번호</label>
                    <input type="password" name="newPassword" id="newPassword" required placeholder="8자 이상, 특수문자 포함">
                </div>
                <div class="input-group">
                    <label>비밀번호 확인</label>
                    <input type="password" id="confirmPassword" required placeholder="비밀번호 재입력">
                </div>
                <button type="submit" class="btn-recover">비밀번호 변경 완료</button>
            </form>

            <div th:if="${param.error}" class="error-msg" th:text="${param.error}"></div>
            
            <div style="margin-top: 20px;">
                <a th:href="@{/mypage}" style="color: #999; text-decoration: none; font-size: 14px;">마이페이지로 돌아가기</a>
            </div>
        </div>
    </div>

<script th:inline="javascript">
    function sendCode() {
        const email = document.getElementById('email').value;
        fetch('/api/member/send-verification?email=' + encodeURIComponent(email), { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.status === 'success') {
                    document.getElementById('codeGroup').style.display = 'block';
                }
            });
    }

    function verifyCode() {
        const email = document.getElementById('email').value;
        const code = document.getElementById('verificationCode').value;
        fetch(`/api/member/verify-email?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('인증되었습니다.');
                    document.getElementById('emailSection').style.display = 'none';
                    document.getElementById('passwordSection').style.display = 'block';
                } else {
                    alert('인증 코드가 틀렸거나 만료되었습니다.');
                }
            });
    }

    document.getElementById('passwordSection').onsubmit = function(e) {
        const p1 = document.getElementById('newPassword').value;
        const p2 = document.getElementById('confirmPassword').value;
        if (p1 !== p2) {
            alert('비밀번호가 일치하지 않습니다.');
            return false;
        }
    };
</script>
</body>
</html>
