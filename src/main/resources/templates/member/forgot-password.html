<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기 - Passfail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/member/join.css}">
    <style>
        .wrap { margin: 40px auto; }
        .recovery-box { text-align: center; padding: 20px; }
        .recovery-box p { color: #666; margin-bottom: 20px; line-height: 1.6; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-recover { width: 100%; padding: 12px; background-color: #4A90E2; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn-recover:hover { background-color: #357ABD; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1 onclick="location.href='/main'" style="cursor:pointer;">비밀번호 찾기</h1>
        <div class="recovery-box">
            <p>
                가입하신 이메일 주소를 입력해 주세요.<br>
                해당 이메일로 임시 비밀번호를 발송해 드립니다.
            </p>
            <form id="recoverForm" th:action="@{/forgot-password}" method="post">
                <div class="input-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="email" placeholder="example@passfail.com" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-recover">임시 비밀번호 발송</button>
                <div id="statusMsg" class="error-msg" style="display: none;"></div>
                <div th:if="${param.error}" class="error-msg">
                    존재하지 않는 이메일이거나 발송에 실패했습니다.
                </div>
            </form>
            <div id="successBox" style="display: none; margin-top: 20px;">
                <p style="color: #27ae60; font-weight: bold;">
                    비밀번호 발송 요청을 완료했습니다!<br>
                    잠시 후 이메일을 확인해 주세요.
                </p>
            </div>
            <div style="margin-top: 20px;">
                <a th:href="@{/login}" style="color: #999; text-decoration: none; font-size: 14px;">로그인 화면으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        $(document).ready(function() {
            $('#recoverForm').on('submit', function(e) {
                e.preventDefault();
                
                const email = $('#email').val();
                const $btn = $('#submitBtn');
                const $status = $('#statusMsg');
                
                // [즉시 반응] 버튼 비활성화 및 상태 표시
                $btn.prop('disabled', true).text('발송 요청 중...');
                $status.hide();
                
                // 300ms 후에 성공 메시지를 미리 보여주어 체감 속도 향상 (Optimistic UI)
                setTimeout(() => {
                    if ($btn.prop('disabled')) {
                        $('#recoverForm').fadeOut(300, function() {
                            $('#successBox').fadeIn();
                        });
                    }
                }, 400);

                $.ajax({
                    url: [[@{/forgot-password}]],
                    type: 'POST',
                    data: { email: email },
                    success: function() {
                        // 이미 위에서 successBox를 보여주고 있음
                    },
                    error: function() {
                        // 만약 에러가 발생하면 다시 폼을 보여주고 에러 메시지 출력
                        $('#successBox').hide();
                        $('#recoverForm').show();
                        $btn.prop('disabled', false).text('임시 비밀번호 발송');
                        $status.text('발송 중 오류가 발생했습니다. 이메일을 다시 확인해 주세요.').show();
                    }
                });
            });
        });
    </script>
</body>
</html>
