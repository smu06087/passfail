<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기 - Passfail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/member/join.css}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1fdf4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1e293b;
        }
        .wrap { 
            width: 440px; 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(14px);
            padding: 48px; 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            border-radius: 32px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
        h1 { 
            text-align: center; 
            font-size: 28px; 
            margin-bottom: 32px; 
            font-weight: 900;
            letter-spacing: -0.05em;
            color: #1e293b;
            cursor: pointer;
        }
        .recovery-box { text-align: center; }
        .recovery-box p { color: #64748b; margin-bottom: 32px; line-height: 1.6; font-size: 15px; font-weight: 600; }
        
        .input-group { margin-bottom: 24px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #64748b; }
        .input-group input { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            box-sizing: border-box; 
            background: #f8fafc;
            font-family: inherit;
            transition: all 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #22c55e;
            background: white;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .btn-recover { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 800;
            cursor: pointer; 
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.2);
            transition: all 0.2s;
        }
        .btn-recover:hover:not(:disabled) { 
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(34, 197, 94, 0.2);
        }
        .btn-recover:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .error-msg { color: #ef4444; font-size: 14px; margin-top: 16px; font-weight: 700; }
        .back-link { margin-top: 32px; display: block; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 700; }
        .back-link:hover { color: #64748b; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1 onclick="location.href='/main'" style="cursor:pointer;">비밀번호 찾기</h1>
        <div class="recovery-box">
            <p>
                가입하신 이메일 주소를 입력해 주세요.<br>
                해당 이메일로 임시 비밀번호를 발송해 드립니다.
            </p>
            <form id="recoverForm" th:action="@{/forgot-password}" method="post">
                <div class="input-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="email" placeholder="example@passfail.com" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-recover">임시 비밀번호 발송</button>
                <div id="statusMsg" class="error-msg" style="display: none;"></div>
                <div th:if="${param.error}" class="error-msg">
                    존재하지 않는 이메일이거나 발송에 실패했습니다.
                </div>
            </form>
            <div id="successBox" style="display: none; margin-top: 20px;">
                <p style="color: #27ae60; font-weight: bold;">
                    비밀번호 발송 요청을 완료했습니다!<br>
                    잠시 후 이메일을 확인해 주세요.
                </p>
            </div>
            <div style="margin-top: 20px;">
                <a th:href="@{/login}" style="color: #999; text-decoration: none; font-size: 14px;">로그인 화면으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        $(document).ready(function() {
            $('#recoverForm').on('submit', function(e) {
                e.preventDefault();
                
                const email = $('#email').val();
                const $btn = $('#submitBtn');
                const $status = $('#statusMsg');
                
                // [즉시 반응] 버튼 비활성화 및 상태 표시
                $btn.prop('disabled', true).text('발송 요청 중...');
                $status.hide();
                
                // 300ms 후에 성공 메시지를 미리 보여주어 체감 속도 향상 (Optimistic UI)
                setTimeout(() => {
                    if ($btn.prop('disabled')) {
                        $('#recoverForm').fadeOut(300, function() {
                            $('#successBox').fadeIn();
                        });
                    }
                }, 400);

                $.ajax({
                    url: [[@{/forgot-password}]],
                    type: 'POST',
                    data: { email: email },
                    success: function() {
                        // 이미 위에서 successBox를 보여주고 있음
                    },
                    error: function() {
                        // 만약 에러가 발생하면 다시 폼을 보여주고 에러 메시지 출력
                        $('#successBox').hide();
                        $('#recoverForm').show();
                        $btn.prop('disabled', false).text('임시 비밀번호 발송');
                        $status.text('발송 중 오류가 발생했습니다. 이메일을 다시 확인해 주세요.').show();
                    }
                });
            });
        });
    </script>
</body>
</html>
