<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - Passfail</title>
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1fdf4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #1e293b;
            padding: 40px 0;
        }
        
        /* Responsive Scaling Logic */
        html { zoom: 1; }
        @media screen and (max-width: 1700px) { html { zoom: 0.95; } }
        @media screen and (max-width: 1550px) { html { zoom: 0.9; } }
        @media screen and (max-width: 1400px) { html { zoom: 0.85; } }
        @media screen and (max-width: 1280px) { html { zoom: 0.8; } }
        @media screen and (max-width: 1024px) { html { zoom: 0.75; } }
        @media screen and (max-width: 768px) { html { zoom: auto; } }

        .signup-container {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(14px);
            padding: 48px;
            border-radius: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            width: 100%;
            max-width: 460px;
            text-align: center;
        }
        h1 { 
            color: #1e293b; 
            margin-bottom: 32px; 
            font-weight: 900; 
            font-size: 28px;
            letter-spacing: -0.05em;
        }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #64748b; font-size: 14px; font-weight: 700; }
        
        .input-group {
            display: flex;
            gap: 8px;
        }
        
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            background: #f8fafc;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .input-group input {
            flex: 1;
        }
        
        input:focus {
            outline: none;
            border-color: #22c55e;
            background: white;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }
        
        .btn-check {
            padding: 0 20px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .btn-check:hover {
            background: #0f172a;
        }
        
        .btn-check:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-join {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            margin-top: 24px;
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.2);
            transition: all 0.2s;
        }
        .btn-join:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(34, 197, 94, 0.2); }
        .btn-join:active:not(:disabled) { transform: translateY(0); }
        .btn-join:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 약관 동의 섹션 */
        .terms-group {
            margin-top: 24px;
            padding: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            text-align: left;
        }
        .term-item {
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
        }
        .term-item input {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #22c55e;
        }
        .term-item label {
            margin-bottom: 0;
            cursor: pointer;
        }

        /* 하단 링크 */
        .footer { margin-top: 24px; font-size: 13px; color: #94a3b8; font-weight: 700; }
        .footer a { color: #22c55e; text-decoration: none; margin-left: 4px; }
        .footer a:hover { text-decoration: underline; }
        
        .id-msg { display: block; font-size: 12px; margin-top: 6px; font-weight: 700; }
        .error-msg { color: #ef4444; }
        .success-msg { color: #10b981; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>회원가입</h1>
        
        <div th:if="${param.error}" class="id-msg error-msg" style="text-align: center; margin-bottom: 16px;" th:text="${param.error}"></div>
        
        <form id="signupForm" th:action="@{/signup}" method="post">
            <div class="form-group">
                <label for="username">아이디 (7자 이상, 영문/숫자)</label>
                <div class="input-group">
                    <input type="text" id="username" name="username" required minlength="7" pattern="^[a-zA-Z0-9]+$" title="영문과 숫자만 사용 가능합니다.">
                    <button type="button" id="checkUsernameBtn" class="btn-check">중복 확인</button>
                </div>
                <span id="usernameMsg" class="id-msg"></span>
            </div>

            <div class="form-group">
                <label for="password">비밀번호 (8자 이상, 특수문자 포함)</label>
                <input type="password" id="password" name="password" required minlength="8">
                <span id="passwordMsg" class="id-msg"></span>
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <div class="input-group">
                    <input type="email" id="email" name="email" required>
                    <button type="button" id="sendVerificationBtn" class="btn-check">인증번호 발송</button>
                </div>
            </div>

            <div class="form-group" id="verificationGroup" style="display:none;">
                <label for="verificationCode">인증번호</label>
                <div class="input-group">
                    <input type="text" id="verificationCode" name="verificationCode">
                    <button type="button" id="verifyEmailBtn" class="btn-check">인증 확인</button>
                </div>
                <span id="emailMsg" class="id-msg"></span>
            </div>

            <div class="terms-group">
                <div class="term-item">
                    <input type="checkbox" id="privacyPolicyAgreed" name="privacyPolicyAgreed" required>
                    <label for="privacyPolicyAgreed">개인정보 수집 및 이용에 동의합니다. (필수)</label>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-join" disabled>가입하기</button>
        </form>
        <div class="footer">
            이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
        </div>
    </div>
    <script th:src="@{/js/member/signup.js}"></script>
</body>
</html>
