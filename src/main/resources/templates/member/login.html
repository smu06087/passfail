<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Passfail - 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1fdf4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1e293b;
        }
        .login-container {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(14px);
            padding: 48px;
            border-radius: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 { 
            color: #1e293b; 
            margin-bottom: 32px; 
            font-weight: 900; 
            font-size: 28px;
            letter-spacing: -0.05em;
        }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #64748b; font-size: 14px; font-weight: 700; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            background: #f8fafc;
            font-family: inherit;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #22c55e;
            background: white;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            margin-top: 12px;
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.2);
            transition: all 0.2s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(34, 197, 94, 0.2); }
        .btn-login:active { transform: translateY(0); }

        /* 소셜 로그인 섹션 */
        .social-login { margin-top: 32px; border-top: 1px solid #f1f5f9; padding-top: 24px; }
        .social-login p { color: #94a3b8; font-size: 13px; margin-bottom: 16px; font-weight: 700; }
        .social-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            border: 1px solid #e2e8f0;
            background: white;
            transition: all 0.2s;
        }
        .social-btn:hover { border-color: #cbd5e1; background: #f8fafc; }
        .btn-google { background-color: #fff; }
        .btn-kakao { background-color: #FEE500; border: none; color: #3c1e1e; }
        .btn-naver { background-color: #03C75A; color: #fff; border: none; }
        .btn-github { background-color: #1e293b; color: #fff; border: none; }

        /* 하단 링크 */
        .footer-links { margin-top: 24px; font-size: 13px; color: #94a3b8; font-weight: 700; }
        .footer-links a { color: #22c55e; text-decoration: none; margin: 0 8px; }
        .footer-links a:hover { text-decoration: underline; }
        
        .error-msg { color: #ef4444; font-size: 13px; margin-bottom: 16px; font-weight: 700; }
        .success-msg { color: #10b981; font-size: 13px; margin-bottom: 16px; font-weight: 700; }
    </style>
</head>
<body>

<div class="login-container">
    <h2 onclick="location.href='/main'" style="cursor:pointer;">Passfail Login</h2>

    <!-- 에러 메시지 처리 -->
    <div th:if="${param.error}" class="error-msg">
        아이디 또는 비밀번호가 일치하지 않습니다.
    </div>
    <div th:if="${param.resetSuccess}" class="success-msg">
        비밀번호가 이메일로 발송되었습니다.
    </div>
    <div th:if="${param.signupSuccess}" class="success-msg">
        회원가입이 완료되었습니다. 로그인해 주세요.
    </div>
    <div th:if="${param.withdrawn}" class="success-msg">
        계정 탈퇴가 완료되었습니다. 이용해 주셔서 감사합니다.
    </div>

    <!-- 로컬 로그인 폼 (SecurityConfig 설정과 일치) -->
    <form th:action="@{/loginProc}" method="post">
        <div class="form-group">
            <label>아이디</label>
            <input type="text" name="username" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit" class="btn-login">로그인</button>
    </form>

    <!-- 소셜 로그인 -->
    <div class="social-login">
        <p>또는 소셜 계정으로 로그인</p>
        <div class="social-buttons">
            <a href="/oauth2/authorization/google" class="social-btn btn-google">Google</a>
            <a href="/oauth2/authorization/naver" class="social-btn btn-naver">Naver</a>
            <a href="/oauth2/authorization/kakao" class="social-btn btn-kakao">Kakao</a>
            <a href="/oauth2/authorization/github" class="social-btn btn-github">GitHub</a>
        </div>
    </div>

    <!-- 하단 부가 기능 -->
    <div class="footer-links">
        <a href="/signup">회원가입</a> | 
        <a href="/forgot-password">비밀번호 찾기</a>
    </div>
</div>

</body>
</html>
