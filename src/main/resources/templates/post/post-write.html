<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - Passfail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1fdf4 100%);
            color: #1e293b;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .write-box {
            background: white;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            border: 1px solid #e2e8f0;
        }
        h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #22c55e;
            color: #1e293b;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #475569;
        }
        select, input[type="text"], textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: #1e293b;
            background: #f8fafc;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
            background: white;
        }
        textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.7;
        }
        .char-count {
            text-align: right;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }
        .btn {
            padding: 11px 28px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn:hover { opacity: 0.87; transform: translateY(-1px); }
        .btn-submit {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 4px 12px rgba(34,197,94,0.25);
        }
        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
        }
    </style>
    <div th:replace="~{fragments/navbar :: navbarStyles}"></div>
</head>
<body class="pt-20">
    <div th:replace="~{fragments/navbar :: mainNavbar}"></div>
    <div class="container">
        <div class="write-box">
            <h2>✏️ 글쓰기</h2>

            <div class="form-group">
                <label for="category">카테고리 <span style="color:#ef4444">*</span></label>
                <select id="category">
                    <option value="">카테고리를 선택하세요</option>
                    <option value="FREE">자유</option>
                    <option value="NOTICE">공지</option>
                    <option value="QNA">Q&amp;A</option>
                    <option value="REVIEW">후기</option>
                </select>
            </div>

            <div class="form-group">
                <label for="title">제목 <span style="color:#ef4444">*</span></label>
                <input type="text" id="title"
                       placeholder="제목을 입력하세요"
                       maxlength="200"
                       oninput="updateCharCount('title', 'titleCount', 200)">
                <div class="char-count"><span id="titleCount">0</span> / 200</div>
            </div>

            <div class="form-group">
                <label for="content">내용 <span style="color:#ef4444">*</span></label>
                <textarea id="content"
                          placeholder="내용을 입력하세요..."
                          oninput="updateCharCount('content', 'contentCount', 5000)"
                          maxlength="5000"></textarea>
                <div class="char-count"><span id="contentCount">0</span> / 5000</div>
            </div>

            <div class="btn-row">
                <button class="btn btn-cancel" onclick="location.href='/board'">취소</button>
                <button class="btn btn-submit" onclick="submitPost()">등록하기</button>
            </div>
        </div>
    </div>

    <script>
        function updateCharCount(inputId, countId, max) {
            const len = document.getElementById(inputId).value.length;
            document.getElementById(countId).textContent = len;
        }

        async function submitPost() {
            const category = document.getElementById('category').value;
            const title    = document.getElementById('title').value.trim();
            const content  = document.getElementById('content').value.trim();

            if (!category) { alert('카테고리를 선택해주세요.'); return; }
            if (!title)    { alert('제목을 입력해주세요.'); return; }
            if (title.length > 200) { alert('제목은 200자 이하로 입력해주세요.'); return; }
            if (!content)  { alert('내용을 입력해주세요.'); return; }

            try {
                const response = await fetch('/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ category, title, content })
                });

                if (response.ok) {
                    // Location 헤더: /posts/5 → /posts/5/view 로 이동
                    const locationHeader = response.headers.get('Location');
                    if (locationHeader) {
                        window.location.href = locationHeader + '/view';
                    } else {
                        window.location.href = '/board';
                    }
                } else if (response.status === 401 || response.status === 403) {
                    alert('로그인이 필요합니다.');
                    window.location.href = '/login';
                } else {
                    const err = await response.json().catch(() => ({}));
                    alert(err.message || '글쓰기에 실패했습니다. 다시 시도해주세요.');
                }
            } catch (e) {
                console.error('글쓰기 오류:', e);
                alert('오류가 발생했습니다. 다시 시도해주세요.');
            }
        }
    </script>
    <script th:replace="~{fragments/navbar :: navbarScript}"></script>
</body>
</html>
