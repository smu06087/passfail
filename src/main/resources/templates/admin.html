<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passfail Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js (차트 시각화) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons (아이콘 라이브러리) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        
        /* 초록빛 그라데이션 배경 [Gradient - ˈɡreɪdiənt] */
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 50%, #f7fee7 100%);
            min-height: 100vh;
        }

        .sidebar-item:hover { color: #22c55e; background-color: #f0fdf4; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        
        /* 부드러운 호버 애니메이션 */
        .stat-card { transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
    <div th:replace="~{fragments/navbar :: navbarStyles}"></div>
</head>
<body class="text-gray-800">
    <div th:replace="~{fragments/navbar :: mainNavbar}"></div>

    <div class="flex">
        <!-- 1. 사이드바 (Sidebar [ˈsaɪdbɑːr]) -->
        <aside class="w-64 bg-white border-r border-gray-100 flex flex-col fixed h-full shadow-sm z-40">
            <div class="p-8 border-b border-gray-50">
                <h1 class="text-2xl font-black text-green-600 tracking-tighter flex items-center gap-2">
                    <i data-lucide="check-circle"></i> Passfail
                </h1>
            </div>
            
            <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-4 space-y-8 mt-4">
                <!-- JavaScript Loop (반복문)으로 메뉴 생성 -->
            </nav>
            
            <div class="p-8 border-t border-gray-50">
                <div class="flex items-center gap-3 text-gray-400 font-bold text-xs tracking-widest uppercase">
                    <i data-lucide="settings" size="14"></i> Configuration
                </div>
            </div>
        </aside>

        <!-- 2. 메인 콘텐츠 (Main Content [meɪn ˈkɑːntent]) -->
        <main class="ml-64 flex-1 p-12">
            
            <!-- 헤더 (Header [ˈhedər]) -->
            <header class="flex justify-between items-center mb-12">
                <div>
                    <h2 class="text-3xl font-black text-gray-900 tracking-tight">대시보드</h2>
                    <p class="text-sm text-gray-400 mt-1">Passfail 시스템의 전체 현황을 모니터링합니다.</p>
                </div>
                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-4 bg-white p-2 px-4 rounded-2xl border border-gray-100 shadow-sm">
                        <div class="relative cursor-pointer text-gray-400 hover:text-green-600 transition-colors">
                            <i data-lucide="bell" size="20"></i>
                            <span class="absolute -top-1 -right-1 bg-red-500 w-2 h-2 rounded-full border-2 border-white"></span>
                        </div>
                        <div class="h-4 w-[1px] bg-gray-100"></div>
                        <div class="flex items-center gap-3 font-bold cursor-pointer text-sm">
                            <div class="w-8 h-8 bg-green-600 rounded-xl flex items-center justify-center text-white">
                                <i data-lucide="user" size="16"></i>
                            </div>
                            <span>신동엽 관리자</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- 3. 요약 카드 (Summary [ˈsʌməri]) - Loop 활용 -->
            <div id="summary-container" class="grid grid-cols-4 gap-6 mb-12">
                <!-- JavaScript Loop (반복문)로 생성 -->
            </div>

            <!-- 4. 상세 분석 섹션 -->
            <div class="grid grid-cols-3 gap-8">
                
                <!-- 회원 상태 분포 (Pie Chart) -->
                <div class="col-span-2 bg-white/80 p-10 rounded-[3rem] border border-white shadow-xl glass-card relative">
                    <div class="flex justify-between items-start mb-10">
                        <div>
                            <h3 class="font-black text-xl text-gray-900">회원 상태 분포</h3>
                            <p class="text-xs text-gray-400 mt-1">전체 사용자 활동성 분석</p>
                        </div>
                        <i data-lucide="more-horizontal" class="text-gray-300 cursor-pointer"></i>
                    </div>
                    <div class="h-80 flex items-center justify-center relative">
                        <canvas id="statusChart"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <p class="text-[10px] text-gray-400 font-black uppercase tracking-widest">Total</p>
                            <p class="text-4xl font-black text-gray-900">12,456</p>
                        </div>
                    </div>
                </div>

                <!-- 결제 요약 (Payment Summary) - Loop 활용 -->
                <div class="bg-white/80 p-10 rounded-[3rem] border border-white shadow-xl glass-card relative">
                    <div class="flex justify-between items-center mb-10">
                        <h3 class="font-black text-xl text-gray-900">매출 요약</h3>
                        <button class="text-[10px] font-black text-green-600 uppercase tracking-widest hover:underline">Details</button>
                    </div>
                    <div id="payment-summary" class="space-y-8">
                        <!-- JavaScript Loop (반복문)로 생성 -->
                    </div>
                    
                    <div class="mt-12 p-6 bg-green-600 rounded-3xl text-white shadow-lg shadow-green-100">
                        <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest mb-1">Target Achievement</p>
                        <div class="flex justify-between items-end">
                            <span class="text-2xl font-black">92%</span>
                            <i data-lucide="trending-up" size="20"></i>
                        </div>
                        <div class="w-full bg-white/20 h-1.5 rounded-full mt-3 overflow-hidden">
                            <div class="bg-white h-full w-[92%]"></div>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script>
        // [Data Architecture - 데이터 구조]
        const sidebarData = [
            { id: 1, title: "유저 관리", icon: "users", items: ["회원 목록", "권한 설정"] },
            { id: 2, title: "데이터 관리", icon: "database", items: ["문제 라이브러리", "태그 관리"] },
            { id: 3, title: "재무 리포트", icon: "pie-chart", items: ["결제 통계", "정산 관리"] },
            { id: 4, title: "시스템 운영", icon: "shield-check", items: ["보안 모니터링", "로그 분석"] }
        ];

        const summaryData = [
            { id: 1, title: "전체 회원", value: "5,374", icon: "users", color: "text-green-600", bg: "bg-green-50" },
            { id: 2, title: "문제 세트", value: "198", icon: "book-open", color: "text-blue-500", bg: "bg-blue-50" },
            { id: 3, title: "결제 매출", value: "1,304,000", icon: "dollar-sign", color: "text-emerald-600", bg: "bg-emerald-50" },
            { id: 4, title: "오늘 방문", value: "842", icon: "eye", color: "text-orange-500", bg: "bg-orange-50" }
        ];

        const paymentData = [
            { label: "결제 완료", value: "1,304,000", color: "text-green-600" },
            { label: "환불 요청", value: "170,000", color: "text-amber-500" },
            { label: "환불 완료", value: "130,000", color: "text-gray-400" }
        ];

        // [Iteration - 반복문 루프 로직]
        
        // 1. 사이드바 메뉴 렌더링
        const nav = document.getElementById('sidebar-nav');
        sidebarData.forEach(menu => {
            const group = document.createElement('div');
            group.innerHTML = `
                <div class="flex items-center gap-3 text-gray-900 font-black mb-4 text-sm">
                    <div class="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-green-600 shadow-sm">
                        <i data-lucide="${menu.icon}" size="16"></i>
                    </div>
                    <span>${menu.title}</span>
                </div>
                <ul class="ml-11 space-y-3 text-xs font-bold text-gray-400">
                    ${menu.items.map(item => `<li class="sidebar-item p-2 rounded-lg cursor-pointer transition-all">${item}</li>`).join('')}
                </ul> 
            `;
            nav.appendChild(group);
        });

        // 2. 상단 요약 카드 렌더링
        const summaryCont = document.getElementById('summary-container');
        summaryData.forEach(card => {
            const div = document.createElement('div');
            div.className = "stat-card bg-white p-7 rounded-[2rem] border border-gray-50 shadow-sm flex items-center gap-5 cursor-pointer";
            div.innerHTML = `
                <div class="p-4 rounded-2xl ${card.bg}">
                    <i data-lucide="${card.icon}" class="${card.color}" size="24"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 mb-1 font-black uppercase tracking-wider">${card.title}</p>
                    <p class="text-2xl font-black text-gray-900">${card.value}</p>
                </div>
            `;
            summaryCont.appendChild(div);
        });

        // 3. 결제 요약 리스트 렌더링
        const paySum = document.getElementById('payment-summary');
        paymentData.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = `flex justify-between items-end ${idx < paymentData.length - 1 ? 'border-b border-gray-50 pb-6' : ''}`;
            div.innerHTML = `
                <div>
                    <span class="text-gray-400 font-bold text-[10px] uppercase tracking-tighter">${item.label}</span>
                    <p class="font-black text-2xl ${item.color}">${item.value}</p>
                </div>
                <div class="text-[10px] font-black text-gray-300">KRW</div>
            `;
            paySum.appendChild(div);
        });

        // 초기화 및 차트 설정
        lucide.createIcons();

        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: ['활성', '비활성', '정지', '탈퇴'],
                datasets: [{
                    data: [8312, 3421, 523, 200],
                    backgroundColor: ['#16a34a', '#d1d5db', '#f59e0b', '#374151'],
                    borderWidth: 0,
                    hoverOffset: 15
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '82%', 
                plugins: {
                    legend: { 
                        position: 'right',
                        labels: { usePointStyle: true, padding: 30, font: { family: 'Pretendard', size: 12, weight: '700' } }
                    }
                }
            }
        }); 
    </script>
    <script th:replace="~{fragments/navbar :: navbarScript}"></script>
</body>
</html>
